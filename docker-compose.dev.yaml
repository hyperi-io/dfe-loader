# Development docker-compose for local testing
# Use when .env is not configured for external systems (k8s.tyrell.com.au)
#
# Usage:
#   docker-compose -f docker-compose.dev.yaml up -d
#   cargo run -- --config config.dev.yaml
#
# Stop:
#   docker-compose -f docker-compose.dev.yaml down -v

services:
  # ClickHouse for testing inserts
  clickhouse:
    image: clickhouse/clickhouse-server:26.3@sha256:2ef11bbe2e44ab7022f37ff3019b3f2125ed09e919ea6194660be6130b7ca4b7
    container_name: clickhouse-dev
    ports:
      - "9000:9000"   # Native protocol
      - "8123:8123"   # HTTP protocol
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./tests/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Kafka (Redpanda - Kafka-compatible, lighter weight)
  redpanda:
    # Matches KAFKA_TAG in scripts/pgo-workload.sh and dfe-infra's
    # services.redpanda-version. Two pins of the same broker on different
    # patches makes Renovate track two lines and open a PR per line.
    image: redpandadata/redpanda:v26.1.8@sha256:38479b2fa7db291dca9809eeb19dbb9309751820d650fef80c3645ed74142570
    container_name: redpanda-dev
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
    ports:
      - "19092:19092"  # Kafka external
      - "18082:18082"  # Pandaproxy
      - "18081:18081"  # Schema Registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redpanda Console (Kafka UI)
  console:
    image: redpandadata/console:v3.9.0@sha256:26cfba6e7c75c4d16c230945a8aa14462de6ca7e165da9de9d89c465f7af54f9
    container_name: redpanda-console-dev
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  clickhouse-data:
  redpanda-data:
