# Project-specific gitleaks allowlist
# Extends the CI base configuration (ci/.gitleaks.toml)
#
# The CI runs gitleaks to detect secrets in your code. This file lets you
# exclude false positives specific to your project.
#
# Documentation: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

# Example allowlist - uncomment [[allowlist]] blocks as needed
# See: https://github.com/gitleaks/gitleaks#configuration

# [[allowlist]]
# description = "Test files with fake tokens"
# paths = ['''tests/.*\.rs''', '''tests/fixtures/.*''']

# [[allowlist]]
# description = "Example configuration files"
# paths = ['''.env.example''', '''.env.sample''']

# [[allowlist]]
# description = "Known false positive patterns"
# regexes = ['''YOUR_.*_TOKEN''', '''test-token''']

# [[allowlist]]
# description = "Common false positive stopwords"
# stopwords = ["example", "sample", "test", "mock", "fake", "dummy", "placeholder"]
