$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: |-
  Main configuration for dfe-loader.

  ## Hot-Reload Behaviour

  **Hot-reloaded (takes effect on next batch):**
  - `routing.*` -- table fields, defaults, the tenant field and default org, org routing.
    The deployment contract lists `routing` in `hot_paths`, so an edit there
    reaches a running pod without rolling it
  - `timestamp_dq.*` -- timestamp validation thresholds
  - `metadata.*` -- common header injection, tags, _raw handling
  - `field_sanitization.*` -- field name sanitisation rules
  - `buffer.flush_rows` / `buffer.flush_bytes` / `buffer.flush_age_secs`

  **Requires pod restart (connections/state established at startup):**
  - `transport` -- transport type (kafka/grpc) bound at startup
  - `kafka.*` -- Kafka consumer created at startup
  - `grpc.*` -- gRPC server binds at startup
  - `clickhouse.*` -- HTTP client + `clickhouse::Client` created at startup
  - `payload.pipeline_mode` -- pipeline path chosen at startup
  - `metrics.*` -- HTTP metrics server binds at startup
  - `logging.*` -- tracing subscriber installed at startup
  - `scaling.*` -- scaling pressure built at startup
  - `hot_reload.*` -- watcher config set at startup
  - `schema.*` -- schema cache created at startup
  - `geoip.*` -- MMDB readers opened at startup
  - `computed_columns.*` -- computed column cache built at startup
  - `column_directives.*` -- column directive cache built at startup
  - `routing.dlq` -- DLQ backends opened at startup
  - `field_mapping.*` -- mapping rules built at startup
  - `enrichment.*` -- enrichment pipeline built at startup
type: object
properties:
  transport:
    description: "Transport backend: \"kafka\" (default) or \"grpc\". **Restart required.**"
    type: string
    default: kafka
  kafka:
    description: Kafka consumer config. **Restart required.**
    $ref: "#/$defs/KafkaConfig"
    default:
      brokers:
      - localhost:9092
      group: dfe-loader
      topics: []
      topic_regex: null
      client_id: dfe-loader
      sasl: null
      tls: null
      allow_insecure_transport: false
      librdkafka_overrides:
        statistics.interval.ms: "5000"
      acknowledgements:
        enabled: true
  grpc:
    description: gRPC transport config. **Restart required.**
    $ref: "#/$defs/GrpcConfig"
    default:
      listen: 0.0.0.0:6000
      recv_buffer_size: 10000
      recv_timeout_ms: 100
      max_message_size: 16777216
      compression: false
      default_topic: main_land
      acknowledgements:
        enabled: true
      max_hold_ms: 13500
  clickhouse:
    description: "`ClickHouse` connection config. **Restart required.**"
    $ref: "#/$defs/ClickHouseConfig"
    default:
      hosts:
      - localhost:8123
      database: dfe
      username: default
      password: "***REDACTED***"
      protocol: http
      insert_format: rowbinary
      tables: []
      tls: null
      connect_timeout_ms: 5000
      request_timeout_ms: 60000
      insert_timeout_ms: 60000
  payload:
    description: Payload pipeline mode. **Restart required.**
    $ref: "#/$defs/PayloadConfig"
    default:
      pipeline_mode: json_primary
  metrics:
    description: Metrics server config. **Restart required.**
    $ref: "#/$defs/MetricsConfig"
    default:
      enabled: true
      address: 0.0.0.0:9090
  logging:
    description: Logging config. **Restart required.**
    $ref: "#/$defs/LoggingConfig"
    default:
      level: info
      format: json
  schema:
    description: Schema cache config. **Restart required.**
    $ref: "#/$defs/SchemaConfig"
    default:
      cache_ttl_secs: 300
      refresh_on_error: true
      pre_warm_retry_secs: 60
      pending_max_per_table: 1000
      pending_max_total: 10000
      pending_max_age_secs: 30
  geoip:
    description: "`GeoIP` enrichment (MMDB readers). **Restart required.**"
    $ref: "#/$defs/GeoIpConfig"
    default:
      enabled: false
      provider: db_ip_lite
      city_db_path: null
      asn_db_path: null
      auto_download:
        enabled: true
        data_dir: /var/lib/dfe/geoip
        maxmind_account_id: null
        maxmind_license_key: null
        ipinfo_token: null
        max_age_days: 30
        max_database_bytes: 536870912
      cache_capacity: 100000
  computed_columns:
    description: Computed columns cache. **Restart required.**
    $ref: "#/$defs/ComputedColumnsConfig"
    default:
      columns: {}
      overrides: {}
  column_directives:
    description: Per-column directive config. **Restart required.**
    $ref: "#/$defs/ColumnDirectivesConfig"
    default:
      global: {}
      tables: {}
  hot_reload:
    description: Hot-reload watcher config. **Restart required.**
    $ref: "#/$defs/HotReloadConfig"
    default:
      enabled: true
      poll_interval_secs: 5
      debounce_ms: 500
  scaling:
    description: Scaling pressure config. **Restart required.**
    $ref: "#/$defs/ScalingConfig"
    default:
      enabled: true
      memory_gate_threshold: 0.8
      weight_kafka_lag: 0.35
      weight_buffer_depth: 0.25
      weight_insert_latency: 0.15
      weight_memory: 0.15
      weight_errors: 0.1
      saturation_kafka_lag: 100000.0
      saturation_buffer_depth: 10000.0
      saturation_insert_latency: 5.0
      saturation_errors: 100.0
  batch_processing:
    description: >-
      Batch processing engine config (SIMD parse, pre-route, parallelism). **Restart
      required.**
    $ref: "#/$defs/BatchProcessingConfig"
    default:
      max_chunk_size: 10000
      routing_field: null
      pre_route_filters: []
      parse_error_action: dlq
      known_fields:
      - _table
      - _timestamp
      - _source
      - host
      - source_type
      - event_type
  routing:
    description: Table and tenant routing. **Hot-reloaded**, `routing.dlq` aside.
    $ref: "#/$defs/RoutingConfig"
    default:
      table_fields:
      - _source
      default_db: dfe
      default_table: main
      org_id_field: _org_id
      default_org_id: default
      org_routes: []
      source_to_table: {}
      topic_suffixes:
      - _land
      - _load
      dlq:
        enabled: true
        mode: cascade
        topic: dfe_loader_dlq
        topic_suffix: .dlq
        file_enabled: true
        file_path: /var/spool/dfe/dlq
        kafka_enabled: true
  buffer:
    description: Buffer flush thresholds. **Hot-reloaded.**
    $ref: "#/$defs/BufferConfig"
    default:
      flush_bytes: 67108864
      flush_rows: 20000
      flush_age_secs: 5
  memory:
    description: Memory limits. **Hot-reloaded.**
    $ref: "#/$defs/MemoryConfig"
    default:
      limit_bytes: 0
      pressure_threshold: 0.8
  timestamp_dq:
    description: Timestamp data quality validation. **Hot-reloaded.**
    $ref: "#/$defs/TimestampDqConfig"
    default:
      enabled: true
      max_future_seconds: 600
      max_past_seconds: 0
      invalid_action: replace_with_now
      correct_known_bad: true
  field_sanitization:
    description: Field name sanitisation. **Hot-reloaded.**
    $ref: "#/$defs/FieldSanitizationConfig"
    default:
      strip_at_prefix: true
      handle_numeric_prefix: true
      numeric_prefix: col_
      collapse_underscores: true
      trim_underscores: true
      collision_strategy: last_wins
  metadata:
    description: Common header injection, tags, _raw handling. **Hot-reloaded.**
    $ref: "#/$defs/MetadataConfig"
    default:
      enabled: true
      inject_timestamp_load: true
      extract_timestamp_collector: true
      collector_timestamp_path: tags.collector.timestamp
      tags_fields:
      - tags
      - _tags
      - meta
      - metadata.tags
      tags_output: _tags
      drop_tags: false
      capture_mode: full
      table_capture_modes: {}
      capture_json: true
      json_output: _json
      capture_raw: true
      raw_source_fields:
      - logoriginal
      raw_output: _raw
      capture_source: true
      source_fields:
      - _source
      source_output: _source
      disable_json_tables: []
      disable_raw_tables: []
      remove_routing_fields: true
  coercion:
    description: Type coercion config. **Hot-reloaded.**
    $ref: "#/$defs/CoercionConfig"
    default:
      type_mappings: {}
      unknown_type_fallback: String
      null_handling: default
      null_strings:
      - "null"
      - "NULL"
      - "Null"
      - None
      - nil
      - undefined
      - \N
      - <null>
      - NA
      - N/A
      - n/a
      - "NaN"
      default_timezone: UTC
      timezone_fields:
      - tags_collector_timezone
      array_to_json: true
      strict: false
  field_mapping:
    description: Field mapping overrides. **Restart required.**
    $ref: "#/$defs/FieldMappingConfig"
    default:
      enabled: false
      default_action: rename
      builtin: none
      files: []
      overrides: {}
  enrichment:
    description: IP enrichment field selection. **Restart required.**
    $ref: "#/$defs/EnrichmentConfig"
    default:
      ip_fields:
      - src_ip
      - client_ip
      - ip
      - source_ip
      reputation:
        enabled: false
        cache_capacity: 100000
        blocklist_files: []
      risk_scoring:
        enabled: false
        preset: global
$defs:
  KafkaConfig:
    type: object
    properties:
      brokers:
        type: array
        items:
          type: string
        default:
        - localhost:9092
      group:
        type: string
        default: dfe-loader
      topics:
        description: |-
          Explicit topic list. Empty = auto-discover every `*_load` / `*_land`
          topic on the broker, with load-over-land fallback applied. The
          loader's own DLQ topic is never discovered.
        type: array
        items:
          type: string
        default: []
      topic_regex:
        description: |-
          Regex that replaces the `*_load` / `*_land` match when auto-discovering.
          Ignored when `topics` is set.
        type:
        - string
        - "null"
        default: null
      client_id:
        type: string
        default: dfe-loader
      sasl:
        anyOf:
        - $ref: "#/$defs/SaslConfig"
        - type: "null"
        default: null
      tls:
        anyOf:
        - $ref: "#/$defs/TlsConfig"
        - type: "null"
        default: null
      allow_insecure_transport:
        description: |-
          Opt in to an unencrypted Kafka transport (`plaintext` / `sasl_plaintext`)
          in production. scalo (>=2.8) rejects unencrypted transports under a
          production profile at transport construction unless this is set —
          data and SASL/PLAIN credentials would otherwise ship in the clear. Leave
          `false` (the default) and configure TLS, or set `true` only when the
          in-cluster traffic is already mesh-encrypted.
        type: boolean
        default: false
      librdkafka_overrides:
        description: Raw librdkafka configuration overrides (highest priority).
        type: object
        additionalProperties:
          type: string
        default:
          statistics.interval.ms: "5000"
      acknowledgements:
        description: |-
          `enabled: true` (the default) commits an offset only once its row is in
          `ClickHouse` or the DLQ, so a crash re-delivers it. `enabled: false`
          commits each batch as it is received: a crash or a failed insert loses
          what was committed.
        $ref: "#/$defs/AcknowledgementsConfig"
        default:
          enabled: true
  SaslConfig:
    type: object
    properties:
      enabled:
        description: Enable SASL authentication
        type: boolean
        default: false
      mechanism:
        description: |-
          SASL mechanism. Connectable values: none, plain, `scram_sha_256`,
          `scram_sha_512`. `oauthbearer` and `aws_msk_iam` parse but are rejected
          at startup — see the `oauth_*` / `aws_*` fields below. An unrecognised
          string is a startup error, not a silent fall back to the default.
        type: string
        default: scram_sha_512
      username:
        type: string
        default: ""
      password:
        type: string
        x-scalo-secret: true
        writeOnly: true
        default: "***REDACTED***"
      oauth_token_endpoint:
        description: OAuth token endpoint URL. Not wired — see the OAUTHBEARER note above.
        type:
        - string
        - "null"
        default: null
      oauth_client_id:
        description: OAuth client ID. Not wired.
        type:
        - string
        - "null"
        default: null
      oauth_client_secret:
        description: OAuth client secret. Not wired.
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      oauth_scope:
        description: OAuth scope (space-separated). Not wired.
        type:
        - string
        - "null"
        default: null
      oauth_extensions:
        description: OAuth extensions (key=value pairs). Not wired.
        type:
        - string
        - "null"
        default: null
      aws_region:
        description: AWS region for MSK IAM. Not wired — see the AWS MSK IAM note above.
        type:
        - string
        - "null"
        default: null
      aws_access_key_id:
        description: AWS access key ID. Not wired.
        type:
        - string
        - "null"
        default: null
      aws_secret_access_key:
        description: AWS secret access key. Not wired.
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      aws_session_token:
        description: AWS session token. Not wired.
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      aws_profile:
        description: AWS profile name. Not wired.
        type:
        - string
        - "null"
        default: null
  TlsConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      ca_cert_file:
        type:
        - string
        - "null"
        default: null
      cert_file:
        type:
        - string
        - "null"
        default: null
      key_file:
        type:
        - string
        - "null"
        default: null
      skip_verify:
        type: boolean
        default: false
  AcknowledgementsConfig:
    description: |-
      The `acknowledgements` section of an ack-capable transport.

      With `enabled: true` (the default) a source releases its acknowledgement --
      a Kafka offset commit, a gRPC or HTTP response -- only once every piece of
      work built from the record has been delivered, dead-lettered with the DLQ's
      confirmation, or dropped by policy. A failed delivery withholds it, so the
      record is delivered again: duplicates are possible, loss is not.

      With `enabled: false` the source acknowledges at receipt, before the record
      is processed: a crash or a failed delivery loses what was acknowledged.

      ```yaml
      kafka:
        acknowledgements:
          enabled: true
      ```
    type: object
    properties:
      enabled:
        description: Hold the source acknowledgement until every piece is delivered.
        type: boolean
        default: true
  GrpcConfig:
    description: |-
      gRPC transport configuration for receiving messages from dfe-receiver.

      When `transport = "grpc"`, the loader starts a gRPC server listening on
      `listen` and accepts Push RPCs from remote senders (e.g. dfe-receiver).
    type: object
    properties:
      listen:
        description: |-
          Server listen address. Defaults to "0.0.0.0:6000", the push port the
          deployment contract declares, so the Service and the listener agree.
        type:
        - string
        - "null"
        default: 0.0.0.0:6000
      recv_buffer_size:
        description: Receive buffer size (messages buffered from incoming RPCs).
        type: integer
        format: uint
        minimum: 0
        default: 10000
      recv_timeout_ms:
        description: Receive timeout in milliseconds (0 = non-blocking).
        type: integer
        format: uint64
        minimum: 0
        default: 100
      max_message_size:
        description: Maximum message size in bytes (both send and receive).
        type: integer
        format: uint
        minimum: 0
        default: 16777216
      compression:
        description: Enable gzip compression for gRPC messages.
        type: boolean
        default: false
      default_topic:
        description: |-
          Default topic name for messages without a topic in gRPC metadata.
          Used as the routing key when the sender doesn't set a topic.
        type: string
        default: main_land
      acknowledgements:
        description: |-
          `enabled: true` (the default) answers a Push only once its rows are in
          `ClickHouse`, dead-lettered with the DLQ's confirmation, or dropped. A
          failed insert answers `UNAVAILABLE` and the sender retries.
          `enabled: false` answers once the records are queued: a crash loses
          what was answered.
        $ref: "#/$defs/AcknowledgementsConfig"
        default:
          enabled: true
      max_hold_ms:
        description: |-
          The longest a Push waits for its answer before it is told to retry, in
          milliseconds. A sender's own deadline shortens it to leave a tenth of
          that deadline, at least 1 s, for the answer to travel. Keep it below the
          sender's send timeout and above the flush delay.
        type: integer
        format: uint64
        minimum: 0
        default: 13500
  ClickHouseConfig:
    type: object
    properties:
      hosts:
        type: array
        items:
          type: string
        default:
        - localhost:8123
      database:
        type: string
        default: dfe
      username:
        type: string
        default: default
      password:
        type: string
        x-scalo-secret: true
        writeOnly: true
        default: "***REDACTED***"
      protocol:
        type: string
        default: http
      insert_format:
        description: |-
          Row encoding for INSERT: `rowbinary` (default) or `jsoneachrow`. The
          documented spellings `row_binary` and `json_each_row` parse as aliases.
        $ref: "#/$defs/InsertFormat"
        default: rowbinary
      tables:
        type: array
        items:
          type: string
        default: []
      tls:
        anyOf:
        - $ref: "#/$defs/TlsConfig"
        - type: "null"
        default: null
      connect_timeout_ms:
        description: Bound on opening a TCP connection to `ClickHouse`, in milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 5000
      request_timeout_ms:
        description: |-
          Starting bound on a query, which doubles after each timed-out query up to
          300 s, and bound on an insert waiting to hand over its next chunk, in
          milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 60000
      insert_timeout_ms:
        description: |-
          Bound on an insert waiting for the server's answer once its rows are
          sent, in milliseconds. A timed-out batch is held and retried.
        type: integer
        format: uint64
        minimum: 0
        default: 60000
  InsertFormat:
    description: |-
      Insert format for data writes.

      Controls how rows are encoded and sent to `ClickHouse`. `RowBinary` is the
      default — it uses schema reflection to encode `Map<String, Value>` directly
      to binary, so `ClickHouse` skips JSON parsing entirely. This significantly
      reduces CPU load on the `ClickHouse` cluster at scale.

      `JsonEachRow` is the fallback — simpler, self-describing, but the `ClickHouse`
      server pays the cost of parsing every JSON row on ingest.
    oneOf:
    - description: |-
        Schema-reflected `RowBinary` (default).

        Fetches schema from `system.columns`, encodes values to binary client-side.
        `ClickHouse` receives pre-columnarised data — zero server-side parsing.
        Total CPU (client + cluster) is significantly lower than `JSONEachRow`.
      type: string
      const: rowbinary
    - description: |-
        `JSONEachRow` over HTTP.

        Self-describing format — `ClickHouse` coerces types server-side.
        Simpler but the cluster pays the JSON parsing cost on every row.
      type: string
      const: jsoneachrow
  PayloadConfig:
    type: object
    properties:
      pipeline_mode:
        description: |-
          Pipeline processing mode.

          - `"json_primary"` (default): Schema-guided SIMD extraction + zero-copy `_json` splice.
            Only schema-matching columns are extracted; everything else is captured via `_json`.
            Requires schema resolution before per-column extraction works; messages arriving
            before schema is resolved fall back to the legacy path.

          - `"legacy_flatten"`: Existing full-flatten + transform path. All fields are promoted
            to the top level; `_json` is injected as a UTF-8 string copy of the raw payload.
        type: string
        default: json_primary
  MetricsConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      address:
        type: string
        default: 0.0.0.0:9090
  LoggingConfig:
    type: object
    properties:
      level:
        type: string
        default: info
      format:
        type: string
        default: json
  SchemaConfig:
    type: object
    properties:
      cache_ttl_secs:
        description: TTL for cached schemas before background refresh marks them stale.
        type: integer
        format: uint64
        minimum: 0
        default: 300
      refresh_on_error:
        description: Whether to refresh the schema cache on insert errors.
        type: boolean
        default: true
      pre_warm_retry_secs:
        description: |-
          How long, from startup, a failed schema fetch for a table the config
          names is retried in the background. Intake never waits on it. `0`
          fetches each table once.
        type: integer
        format: uint64
        minimum: 0
        default: 60
      pending_max_per_table:
        description: |-
          Max messages buffered per table while waiting for schema resolution.
          On Kafka, excess messages route to DLQ with a security event. On gRPC,
          a table at this cap stops intake until its schema resolves.
        type: integer
        format: uint
        minimum: 0
        default: 1000
      pending_max_total:
        description: |-
          Max messages buffered across all tables.
          On Kafka, hitting this cap evicts the oldest entry FIFO across tables.
          On gRPC it stops intake until the buffer drains.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      pending_max_age_secs:
        description: |-
          Max age of a pending message before it is routed to DLQ. On gRPC with
          no working DLQ, messages keep waiting for their schema instead.
        type: integer
        format: uint64
        minimum: 0
        default: 30
  GeoIpConfig:
    description: "`GeoIP` enrichment configuration"
    type: object
    properties:
      enabled:
        description: Enable `GeoIP` enrichment
        type: boolean
        default: false
      provider:
        description: "`GeoIP` database provider"
        $ref: "#/$defs/GeoIpProvider"
        default: db_ip_lite
      city_db_path:
        description: Explicit path to city MMDB file (overrides auto-download)
        type:
        - string
        - "null"
        default: null
      asn_db_path:
        description: Explicit path to ASN MMDB file (overrides auto-download)
        type:
        - string
        - "null"
        default: null
      auto_download:
        description: Auto-download settings
        $ref: "#/$defs/AutoDownloadConfig"
        default:
          enabled: true
          data_dir: /var/lib/dfe/geoip
          maxmind_account_id: null
          maxmind_license_key: null
          ipinfo_token: null
          max_age_days: 30
          max_database_bytes: 536870912
      cache_capacity:
        description: LRU cache capacity for lookup results
        type: integer
        format: uint
        minimum: 0
        default: 100000
  GeoIpProvider:
    description: |-
      Source of the MMDB databases.

      | Variant | Auth | City | ASN |
      |---|---|---|---|
      | [`DbIpLite`](Self::DbIpLite) | none | yes | yes |
      | [`MaxMindGeoLite2`](Self::MaxMindGeoLite2) | HTTP basic | yes | yes |
      | [`IpLocate`](Self::IpLocate) | none | no | yes |
      | [`IpInfoLite`](Self::IpInfoLite) | token | yes | no |
      | [`Sapics`](Self::Sapics) | none | no | yes |
      | [`Custom`](Self::Custom) | n/a | explicit path | explicit path |
    oneOf:
    - description: DB-IP Lite -- free, anonymous download, city-level, CC BY 4.0.
      type: string
      const: db_ip_lite
    - description: MaxMind GeoLite2 -- free account required (account id + licence key).
      type: string
      const: max_mind_geo_lite2
    - description: IPLocate.io IP to ASN -- free, anonymous, ASN only, CC BY-SA 4.0.
      type: string
      const: ip_locate
    - description: IPinfo Lite -- free token required, country + ASN only.
      type: string
      const: ip_info_lite
    - description: |-
        DB-IP Lite ASN as sapics/ip-location-db republishes it -- free,
        anonymous, ASN only, CC BY 4.0.
      type: string
      const: sapics
    - description: Caller supplies the MMDB paths directly; nothing is downloaded.
      type: string
      const: custom
  AutoDownloadConfig:
    description: "Auto-download settings for `GeoIP` databases: scalo's shape, with the loader's data directory."
    type: object
    properties:
      enabled:
        description: Download a database on startup when the local copy is missing or stale
        type: boolean
        default: true
      data_dir:
        description: Directory the downloaded MMDB files are written to
        type: string
        default: /var/lib/dfe/geoip
      maxmind_account_id:
        description: "`MaxMind` account ID (required for `max_mind_geo_lite2` provider)"
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      maxmind_license_key:
        description: "`MaxMind` license key (required for `max_mind_geo_lite2` provider)"
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      ipinfo_token:
        description: "`IPinfo` token (required for `ip_info_lite` provider)"
        type:
        - string
        - "null"
        x-scalo-secret: true
        writeOnly: true
        default: null
      max_age_days:
        description: "Max age in days before re-downloading (default: 30)"
        type: integer
        format: uint32
        minimum: 0
        default: 30
      max_database_bytes:
        description: |-
          Largest download, and largest database decompressed from it, in bytes.
          A transfer past it is abandoned and the local copy kept.
        type: integer
        format: uint64
        minimum: 0
        default: 536870912
  ComputedColumnsConfig:
    description: |-
      Config cascade overrides for computed columns.

      CEL expressions that produce column values at insert time.
      Expressions are also read from `ClickHouse` column comments (`@computed:` directive).

      Precedence (highest wins):
      1. Config per-table override (`overrides."db.table".column`)
      2. Config global (`columns.column`)
      3. `ClickHouse` column COMMENT `@computed:` directive
    type: object
    properties:
      columns:
        description: |-
          Global computed columns (applied to all tables).
          Key: destination column name, Value: CEL expression.
        type: object
        additionalProperties:
          type: string
        default: {}
      overrides:
        description: "Per-table overrides. Key: \"db.table\", Value: column→expression map."
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            type: string
        default: {}
  ColumnDirectivesConfig:
    description: |-
      Config section for all column-level directives.

      The config equivalent of `ClickHouse` column COMMENT annotations.
      Config always wins — DDL annotations only fill gaps not covered by config.
    type: object
    properties:
      global:
        description: "Global: applies to matching column names across all tables."
        type: object
        additionalProperties:
          $ref: "#/$defs/ColumnDirectivesEntry"
        default: {}
      tables:
        description: "Per-table: key is `\"db.table\"`."
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            $ref: "#/$defs/ColumnDirectivesEntry"
        default: {}
  ColumnDirectivesEntry:
    description: Config entry for one column — all fields optional, only set fields take effect.
    type: object
    properties:
      skip:
        description: Omit this column from inserts.
        type: boolean
        default: false
      default:
        description: Default value when column is null or absent.
      renamed:
        description: "Source field: `\"field\"` or `\"first(a/b/c)\"`."
        type:
        - string
        - "null"
      computed:
        description: CEL expression producing this column's value.
        type:
        - string
        - "null"
      coerce:
        description: Type category override for coercion.
        type:
        - string
        - "null"
  HotReloadConfig:
    description: |-
      Hot-reload configuration

      Controls whether the config file is watched for changes at runtime.
      When enabled, the config cascade is re-evaluated on file change and
      safe-to-reload settings are applied without process restart.

      **Safe to hot-reload:** buffer thresholds, routing, metadata, field
      sanitisation, timestamp DQ.

      **Requires restart:** Kafka brokers/topics/auth, `ClickHouse` hosts/auth,
      payload pipeline mode, transport type, `routing.dlq`, field mapping,
      enrichment.
    type: object
    properties:
      enabled:
        description: |-
          Watch the config file and apply a reloadable change without a restart.
          On unless set false, because the deployment contract's `hot_paths`
          keeps a `routing` edit from rolling the pods.
        type: boolean
        default: true
      poll_interval_secs:
        description: Polling interval in seconds for checking file changes
        type: integer
        format: uint64
        minimum: 0
        default: 5
      debounce_ms:
        description: Debounce duration in milliseconds — minimum time between reloads
        type: integer
        format: uint64
        minimum: 0
        default: 500
  ScalingConfig:
    description: |-
      Scaling pressure configuration for KEDA autoscaling.

      Produces a 0-100 composite metric (`loader_scaling_pressure`) based on
      weighted application signals with two hard gates (circuit breaker, memory).

      Override weights at runtime via env vars:
        `DFE_LOADER__SCALING__WEIGHT_KAFKA_LAG=0.45`
        `DFE_LOADER__SCALING__SATURATION_BUFFER_DEPTH=20000`
    type: object
    properties:
      enabled:
        description: Enable scaling pressure calculation.
        type: boolean
        default: true
      memory_gate_threshold:
        description: Memory usage ratio (0.0-1.0) that forces `scaling_pressure` to 100.
        type: number
        format: double
        default: 0.8
      weight_kafka_lag:
        type: number
        format: double
        default: 0.35
      weight_buffer_depth:
        type: number
        format: double
        default: 0.25
      weight_insert_latency:
        type: number
        format: double
        default: 0.15
      weight_memory:
        type: number
        format: double
        default: 0.15
      weight_errors:
        type: number
        format: double
        default: 0.1
      saturation_kafka_lag:
        type: number
        format: double
        default: 100000.0
      saturation_buffer_depth:
        type: number
        format: double
        default: 10000.0
      saturation_insert_latency:
        type: number
        format: double
        default: 5.0
      saturation_errors:
        type: number
        format: double
        default: 100.0
  BatchProcessingConfig:
    description: |-
      The `batch_processing` keys the loader offers.

      scalo's runtime reads the same key to build the batch engine. JSON is the
      only payload format, so there is no `format` key. One left in a config is
      ignored.
    type: object
    properties:
      max_chunk_size:
        description: Maximum number of messages per rayon chunk.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      routing_field:
        description: JSON field the pre-route reads before the full parse. Unset skips the pre-route.
        type:
        - string
        - "null"
        default: null
      pre_route_filters:
        description: Pre-route filters, evaluated in order. The first match wins.
        type: array
        items:
          $ref: "#/$defs/PreRouteFilterConfig"
        default: []
      parse_error_action:
        description: Action to take when a message fails JSON parsing.
        $ref: "#/$defs/ParseErrorAction"
        default: dlq
      known_fields:
        description: Fields to pre-extract at parse time for routing lookups.
        type: array
        items:
          type: string
        default:
        - _table
        - _timestamp
        - _source
        - host
        - source_type
        - event_type
  PreRouteFilterConfig:
    description: |-
      Pre-route filter applied to each message before routing decisions.

      Filters are evaluated in order. The first filter that matches determines
      the message's [`super::types::PreRouteResult`].
    oneOf:
    - description: Drop the record, committed with its block, if a required field is absent.
      type: object
      properties:
        type:
          type: string
          const: drop_field_missing
        field:
          description: Name of the required field.
          type: string
      required:
      - type
      - field
    - description: Route to DLQ if a field equals a specific value.
      type: object
      properties:
        type:
          type: string
          const: dlq_field_value
        field:
          description: Name of the field to check.
          type: string
        value:
          description: Value that triggers DLQ routing.
          type: string
      required:
      - type
      - field
      - value
  ParseErrorAction:
    description: Action to take when a message fails to parse.
    oneOf:
    - description: Route failed messages to the dead-letter queue (default).
      type: string
      const: dlq
    - description: Silently skip failed messages (counted but not DLQ'd).
      type: string
      const: skip
    - description: Fail the entire batch on the first parse error.
      type: string
      const: fail_batch
  RoutingConfig:
    type: object
    properties:
      table_fields:
        description: |-
          Fields to check for table name (first match wins, dot notation for nested).
          A null or empty value counts as absent. Default: ["_source"]
        type: array
        items:
          type: string
        default:
        - _source
      default_db:
        description: |-
          Database for every org not listed in `org_routes`.
          Default: "dfe" (shared multi-tenant schema)
        type: string
        default: dfe
      default_table:
        description: |-
          Default table if no `table_field` carries a value
          Default: "main"
        type: string
        default: main
      org_id_field:
        description: |-
          Field the `_org_id` tenant column reads (dot notation for nested),
          the common-header `_org_id` unless set.
        type:
        - string
        - "null"
        default: _org_id
      default_org_id:
        description: |-
          Tenant for a record whose `org_id_field` is absent, null or empty: the
          deployment's default org, `default` unless set.
        type: string
        default: default
      org_routes:
        description: |-
          Per-organisation database routing, keyed on the tenant `_org_id` resolves to.
          Only orgs listed here receive their own database, all others go to `default_db`.
          Example: [{`org_id`: "acme"}, {`org_id`: "bigcorp", database: "`bigcorp_dfe`"}]
        type: array
        items:
          $ref: "#/$defs/OrgRoute"
        default: []
      source_to_table:
        description: |-
          Source value to table name mapping
          Maps extracted source values to destination table names
        type: object
        additionalProperties:
          type: string
        default: {}
      topic_suffixes:
        description: |-
          Topic suffixes to strip when deriving _source from Kafka topic name
          Example: topic "`auth_land`" with suffix "_land" → _source = "auth"
        type: array
        items:
          type: string
        default:
        - _land
        - _load
      dlq:
        description: DLQ configuration
        $ref: "#/$defs/DlqConfig"
        default:
          enabled: true
          mode: cascade
          topic: dfe_loader_dlq
          topic_suffix: .dlq
          file_enabled: true
          file_path: /var/spool/dfe/dlq
          kafka_enabled: true
  OrgRoute:
    description: |-
      Explicit per-organisation database routing.

      When an org is listed here, messages from that org are routed to the
      specified database (or `org_id` if `database` is omitted). Orgs NOT
      listed always go to `default_db`.
    type: object
    properties:
      org_id:
        description: "Tenant the record resolves to: its `org_id_field` value, else `default_org_id`."
        type: string
      database:
        description: Target database. If omitted, the `org_id` itself is used as the database name.
        type:
        - string
        - "null"
        default: null
    required:
    - org_id
  DlqConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      mode:
        description: "Backend mode: cascade (default), `fan_out`, `file_only`, `kafka_only`"
        type: string
        default: cascade
      topic:
        description: |-
          DLQ topic name: when non-empty, every Kafka DLQ write routes here
          (routing=common). Empty selects per-destination `{dest}{topic_suffix}`
          routing -- reachable via config file only (flat-env drops empty values).
        type: string
        default: dfe_loader_dlq
      topic_suffix:
        type: string
        default: .dlq
      file_enabled:
        description: File backend settings
        type: boolean
        default: true
      file_path:
        type: string
        default: /var/spool/dfe/dlq
      kafka_enabled:
        description: Kafka backend settings
        type: boolean
        default: true
      kafka_send_timeout_ms:
        description: |-
          How long a flush or shutdown waits for the broker to acknowledge Kafka
          DLQ writes, in milliseconds. Entries still unacknowledged are then
          counted lost. Unset keeps scalo's default.
        type:
        - integer
        - "null"
        format: uint64
        minimum: 0
  BufferConfig:
    type: object
    properties:
      flush_bytes:
        description: |-
          Flush a table's buffer once its rows' input bytes reach this. A row
          counts the bytes of the message it came from.
        type: integer
        format: uint
        minimum: 0
        default: 67108864
      flush_rows:
        description: Flush a table's buffer once it holds this many rows.
        type: integer
        format: uint
        minimum: 0
        default: 20000
      flush_age_secs:
        description: Flush a table's buffer once this many seconds have passed since it last flushed.
        type: integer
        format: uint64
        minimum: 0
        default: 5
  MemoryConfig:
    type: object
    properties:
      limit_bytes:
        description: Maximum memory for buffers in bytes. 0 = auto-detect (67% of available)
        type: integer
        format: uint
        minimum: 0
        default: 0
      pressure_threshold:
        description: Pressure threshold (0.0-1.0) - pause consumption above this
        type: number
        format: double
        default: 0.8
  TimestampDqConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      max_future_seconds:
        type: integer
        format: int64
        default: 600
      max_past_seconds:
        type: integer
        format: int64
        default: 0
      invalid_action:
        type: string
        default: replace_with_now
      correct_known_bad:
        type: boolean
        default: true
  FieldSanitizationConfig:
    type: object
    properties:
      strip_at_prefix:
        type: boolean
        default: true
      handle_numeric_prefix:
        type: boolean
        default: true
      numeric_prefix:
        type: string
        default: col_
      collapse_underscores:
        type: boolean
        default: true
      trim_underscores:
        type: boolean
        default: true
      collision_strategy:
        type: string
        default: last_wins
  MetadataConfig:
    type: object
    properties:
      enabled:
        description: |-
          Master switch for common header field injection (default: true)
          When false, no common header fields (_timestamp, _`org_id`, _raw, _json, _tags, _source)
          are injected. Flattening and sanitization still apply.
        type: boolean
        default: true
      inject_timestamp_load:
        type: boolean
        default: true
      extract_timestamp_collector:
        type: boolean
        default: true
      collector_timestamp_path:
        type: string
        default: tags.collector.timestamp
      tags_fields:
        description: Fields to check for tags (first match wins, dot notation for nested)
        type: array
        items:
          type: string
        default:
        - tags
        - _tags
        - meta
        - metadata.tags
      tags_output:
        description: Output field name for tags (underscore prefix avoids collision)
        type: string
        default: _tags
      drop_tags:
        description: Drop tags entirely after routing extraction (saves storage)
        type: boolean
        default: false
      capture_mode:
        description: |-
          Controls how _json and _raw columns are populated.
          All modes extract promoted fields to schema columns.
        $ref: "#/$defs/CaptureMode"
        default: full
      table_capture_modes:
        description: Per-table capture mode overrides (table name → mode)
        type: object
        additionalProperties:
          $ref: "#/$defs/CaptureMode"
        default: {}
      capture_json:
        description: Store complete original Kafka message as JSON before transformation
        type: boolean
        default: true
      json_output:
        description: Output field name for _json
        type: string
        default: _json
      capture_raw:
        description: Enable _raw field injection from source (zero-copy rename)
        type: boolean
        default: true
      raw_source_fields:
        description: "Source fields to try for rename (first match wins). Default: [\"logoriginal\"]"
        type: array
        items:
          type: string
        default:
        - logoriginal
      raw_output:
        description: Output field name for raw log line
        type: string
        default: _raw
      capture_source:
        description: Enable _source field injection (destination table identifier)
        type: boolean
        default: true
      source_fields:
        description: Fields to check for _source value in message data (first match wins)
        type: array
        items:
          type: string
        default:
        - _source
      source_output:
        description: Output field name for _source
        type: string
        default: _source
      disable_json_tables:
        description: Tables where _json capture is disabled (e.g., ["dfe.metrics"])
        type: array
        items:
          type: string
        default: []
      disable_raw_tables:
        description: Tables where _raw capture is disabled (e.g., ["dfe.metrics"])
        type: array
        items:
          type: string
        default: []
      remove_routing_fields:
        description: Remove routing fields from output after extraction
        type: boolean
        default: true
  CaptureMode:
    description: |-
      Per-table capture override configuration.

      Controls how `_json` and `_raw` columns are populated.

      All modes extract promoted fields to schema columns. The only difference
      is where (or whether) the full payload is preserved.
    oneOf:
    - description: |-
        `_json` = full payload (JSON type); `_raw` = a raw field the record
        carries itself (a receiver's raw capture, or an `@renamed` source), else
        NULL, so a JSON payload is never stored twice.
      type: string
      const: full
    - description: "`_json` = NULL, `_raw` = entire Kafka payload as UTF-8 String"
      type: string
      const: raw_only
    - description: "`_json` = full payload (JSON type), `_raw` = NULL"
      type: string
      const: json_only
    - description: "`_json` = NULL, `_raw` = NULL -- only promoted schema fields"
      type: string
      const: extracted_only
  CoercionConfig:
    description: |-
      Type coercion configuration

      Following the Go clickhouse-loader pattern:
      - Type mappings for custom types
      - Configurable null handling
      - Timezone handling for naive timestamps
    type: object
    properties:
      type_mappings:
        description: |-
          Map custom type names to base coercer categories
          e.g., {"MyCustomInt": "Int", "SpecialString": "String"}
        type: object
        additionalProperties:
          type: string
        default: {}
      unknown_type_fallback:
        description: "Fallback coercer for unknown types (default: \"String\")"
        type: string
        default: String
      null_handling:
        description: How to handle null values in non-nullable columns
        $ref: "#/$defs/NullHandling"
        default: default
      null_strings:
        description: Strings to recognise as null (case-sensitive)
        type: array
        items:
          type: string
        default:
        - "null"
        - "NULL"
        - "Null"
        - None
        - nil
        - undefined
        - \N
        - <null>
        - NA
        - N/A
        - n/a
        - "NaN"
      default_timezone:
        description: Default timezone for naive timestamps (IANA name or +HH:MM)
        type: string
        default: UTC
      timezone_fields:
        description: Event fields to check for timezone info
        type: array
        items:
          type: string
        default:
        - tags_collector_timezone
      array_to_json:
        description: Convert arrays to JSON strings if true
        type: boolean
        default: true
      strict:
        description: "Strict mode: fail on any coercion error"
        type: boolean
        default: false
  NullHandling:
    description: Null handling strategy
    oneOf:
    - description: Substitute type-appropriate default value (recommended)
      type: string
      const: default
    - description: Return error for null in non-nullable column
      type: string
      const: error
    - description: Pass null through (may cause `ClickHouse` errors)
      type: string
      const: passthrough
  FieldMappingConfig:
    description: |-
      Field mapping configuration for normalising source field names.

      Supports renaming or copying fields from source to destination names.
      Rules come from two sources with clear precedence:
      1. `ClickHouse` column comments (`@renamed` directives) — highest priority
      2. External remap files (CSV/YAML/JSON) and built-in presets — lower priority

      CSV files are compatible with the elastic/ecs-mapper format:
      `source_field,destination_field,copy_action`
    type: object
    properties:
      enabled:
        description: "Master switch (default: false — no impact on existing pipelines)"
        type: boolean
        default: false
      default_action:
        description: |-
          Default action when not specified per-field: "rename" or "copy"
          - rename: source field removed, value moved to destination (zero-copy)
          - copy: source field retained, value cloned to destination
        type: string
        default: rename
      builtin:
        description: "Built-in mapping preset: \"ecs\", \"cim\", \"beats\", or \"none\""
        type: string
        default: none
      files:
        description: |-
          External remap file paths (CSV/YAML/JSON, loaded in order)
          Later files override earlier ones for the same destination field.
        type: array
        items:
          type: string
        default: []
      overrides:
        description: Per-destination field action overrides
        type: object
        additionalProperties:
          $ref: "#/$defs/FieldMappingOverride"
        default: {}
  FieldMappingOverride:
    description: Per-field override for mapping action
    type: object
    properties:
      action:
        description: "Action for this field: \"rename\" or \"copy\""
        type: string
    required:
    - action
  EnrichmentConfig:
    description: IP enrichment pipeline configuration (`GeoIP` + reputation + risk scoring)
    type: object
    properties:
      ip_fields:
        description: |-
          Fields to check for IP addresses (first match wins, order matters)

          Common field names to try: ["`src_ip`", "`client_ip`", "ip", "`source_ip`"]
        type: array
        items:
          type: string
        default:
        - src_ip
        - client_ip
        - ip
        - source_ip
      reputation:
        description: IP reputation enrichment (VPN, Tor, proxy, botnet detection)
        $ref: "#/$defs/ReputationEnrichmentConfig"
        default:
          enabled: false
          cache_capacity: 100000
          blocklist_files: []
      risk_scoring:
        description: Risk scoring (weighted composite score from geo + reputation data)
        $ref: "#/$defs/RiskScoringConfig"
        default:
          enabled: false
          preset: global
  ReputationEnrichmentConfig:
    description: Reputation enrichment configuration
    type: object
    properties:
      enabled:
        description: Enable reputation lookups
        type: boolean
        default: false
      cache_capacity:
        description: LRU cache capacity for lookup results
        type: integer
        format: uint
        minimum: 0
        default: 100000
      blocklist_files:
        description: Load blocklists from local files (plain text, one IP or CIDR per line)
        type: array
        items:
          type: string
        default: []
  RiskScoringConfig:
    description: Risk scoring configuration
    type: object
    properties:
      enabled:
        description: Enable risk scoring (requires at least `GeoIP` or reputation to be useful)
        type: boolean
        default: false
      preset:
        description: |-
          Risk preset to use for country risk tables

          Options: "global" (default), "`us_enterprise`", "`eu_enterprise`",
                   "`apac_enterprise`", "`high_security`"
        type: string
        default: global
