# Common Header Profile: timeseries
#
# Time-series event ingestion with full common header.
# This is the default profile shipped with dfe-loader.
#
# NOTE: This profile defines the COMMON HEADER only — the system fields
# that the loader injects into every event. Non-default tables will have
# additional data-specific columns beyond these fields.
#
# Source expression language:
#   @generated: expr          - ClickHouse DEFAULT, loader omits field
#   @source: field | fallback - Extract from data, fallback if missing
#   @source: first(a/b/c)    - First non-null from multiple fields (/ separator)
#   @renamed: field           - Zero-copy rename from source field
#   @captured: description    - Special handling (raw payload sidecar)
#   @derived: description     - Derived from routing/topic metadata

name: timeseries
version: 1
description: "Time-series event ingestion with full common header"

fields:
  - name: _timestamp_load
    type: "DateTime64(3)"
    default: "now64(3)"
    nullable: false
    codec: "Delta, ZSTD(1)"
    source: "@generated: now64(3)"
    comment: "Load time - primary query filter"

  - name: _timestamp
    type: "DateTime64(3)"
    nullable: false
    codec: "Delta, ZSTD(1)"
    source: "@source: timestamp | now()"
    comment: "Event occurrence time (minmax indexed)"

  - name: _timestamp_received
    type: "DateTime64(3)"
    nullable: true
    codec: "Delta, ZSTD(1)"
    source: "@source: timestamp_received"
    comment: "When receiver/loader received the event"

  - name: _uuid
    type: "UUID"
    default: "generateUUIDv7()"
    nullable: false
    source: "@generated: generateUUIDv7()"
    comment: "Unique event ID UUIDv7 (time-ordered)"

  - name: _org_id
    type: "LowCardinality(String)"
    nullable: false
    codec: "ZSTD(1)"
    source: "@source: org_id"
    comment: "Organisation ID for RLS"

  - name: _source
    type: "LowCardinality(String)"
    nullable: false
    codec: "ZSTD(1)"
    source: "@derived: first(_source) | topic_name"
    comment: "Destination table / data source identifier"

  - name: _raw
    type: "String"
    nullable: true
    codec: "ZSTD(3)"
    source: "@renamed: logoriginal"
    comment: "Original raw data as received (e.g. log line / DB row)"

  - name: _json
    type: "JSON"
    nullable: true
    codec: "ZSTD(3)"
    source: "@captured: raw_payload as JSON"
    comment: "Complete Kafka message as native JSON (structured path-based queries)"

  - name: _tags
    type: "JSON"
    nullable: true
    codec: "ZSTD(3)"
    source: "@source: first(tags/_tags/meta/metadata.tags)"
    comment: "Metadata and collector/agent info"

ddl:
  order_by:
    - _org_id
    - _timestamp_load
    - _uuid
  partition_by: "toYYYYMM(_timestamp_load), _org_id"
  settings:
    index_granularity: "8192"
  indexes:
    - name: idx_timestamp
      column: _timestamp
      type: minmax
      granularity: 1
  text_index:
    column: _raw
    auto_detect: true
