# Common Header Profile: passthrough
#
# Pure transport profile — minimal system fields, no field injection.
# Only captures the raw Kafka message as JSON with org/identity tracking.
# Use when the loader is a transparent bridge to ClickHouse
# and source data already has its own schema.
#
# NOTE: This profile defines the COMMON HEADER only — the system fields
# that the loader injects. The source data's own columns are preserved
# in _json and/or added as explicit table columns by DBAs.

name: passthrough
version: 1
description: "Pure transport - raw JSON capture only, no field injection"

fields:
  - name: _timestamp_load
    type: "DateTime64(3)"
    default: "now64(3)"
    nullable: false
    codec: "Delta, ZSTD(1)"
    source: "@generated: now64(3)"
    comment: "Load time"

  - name: _uuid
    type: "UUID"
    default: "generateUUIDv7()"
    nullable: false
    source: "@generated: generateUUIDv7()"
    comment: "Unique event ID"

  - name: _org_id
    type: "LowCardinality(String)"
    nullable: false
    codec: "ZSTD(1)"
    source: "@source: org_id"
    comment: "Organisation ID for RLS"

  - name: _json
    type: "JSON"
    nullable: true
    codec: "ZSTD(3)"
    source: "@captured: raw_payload as JSON"
    comment: "Complete message as native JSON"

ddl:
  order_by:
    - _org_id
    - _timestamp_load
    - _uuid
  partition_by: "toYYYYMM(_timestamp_load), _org_id"
  settings:
    index_granularity: "8192"
