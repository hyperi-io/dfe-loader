classification: product

language: rust

# Quality checks
quality:
  enabled: true
  # osv-scanner does not read deny.toml, so its ignores repeat here.
  ignore:
    - tool: osv-scanner
      id: RUSTSEC-2024-0436
      reason: "paste (dtolnay) unmaintained, no replacement; transitive dep. Mirrors the deny.toml ignore. Drop when a maintained fork lands."
    # No RustSec entry, so deny.toml needs no matching ignore.
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator is registered in dfe-loader or scalo. Accepted risk in dfe-infra docs/THREAT-MODEL.md. Blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31; tracked in hyperi-io/scalo-rs#281."
  # Rust: test specific feature sets (avoids --all-features conflicts).
  rust:
    features:
      - "default"
      - "default,jemalloc"
      - "default,testcontainers"
      # Without it the transport-adapter suite is compiled out. helm_contract.rs asserts it stays.
      - "default,transport-memory"

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Required, not auto: the DLQ-refusal tests set a process-wide RLIMIT_FSIZE of 0, and only nextest keeps each test in a process of its own.
    nextest: true
  # A release runs the full tier: every container test, the protocol and TLS
  # matrix and the peer tools. tests/TESTING.md says which tests are which.
  full:
    required_for_release: true

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    # librdkafka, OpenSSL and the rest link statically from hyperi-ci's
    # prefix, so the image installs no C library packages.
    static_libs: true
    glibc_max: "2.41"
    optimize:
      pgo:
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go). The thin chart is assembled from the
# emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.29"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
