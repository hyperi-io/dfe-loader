# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-native-16cpu

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner. cargo-deny reads
  # deny.toml separately; osv-scanner does NOT, so the paste unmaintained
  # advisory must be ignored here too or the release Quality stage fails.
  ignore:
    - tool: osv-scanner
      id: RUSTSEC-2024-0436
      reason: "paste (dtolnay) unmaintained, no replacement; transitive dep. Mirrors the deny.toml ignore. Drop when a maintained fork lands."
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 is in the
    # lock through scalo, in the affected range (<= 0.32.0, fixed in 0.32.1).
    # The flaw is in BaggagePropagator::extract_with_context, which parses an
    # inbound W3C Baggage header before enforcing its size limits. Nothing here
    # reaches it: neither dfe-loader nor scalo names `baggage`, and neither
    # installs a text map propagator, so the function is never called. It is a
    # GitHub advisory with no RustSec entry, so only osv-scanner sees it and
    # deny.toml needs no matching ignore. Drop this when scalo lifts its
    # opentelemetry_sdk pin to >= 0.32.1 (scalo-rs#34, scalo-rs#100).
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: BaggagePropagator::extract_with_context is unreachable (no text map propagator, no baggage in dfe-loader or scalo). Drop when scalo allows opentelemetry_sdk >= 0.32.1 (scalo-rs#34/#100)."
  # Rust: test specific feature sets (avoids --all-features conflicts).
  # DFE policy 2026-04-17 — jemalloc only; mimalloc removed.
  rust:
    features:
      - "default"                    # Default features
      - "default,jemalloc"           # With jemalloc allocator
      - "default,testcontainers"     # With testcontainers integration tests
      # Required: transport-memory gates MemoryTransportAdapter, so without
      # this set the transport-adapter suite is compiled out rather than run.
      # helm_contract.rs asserts it stays listed.
      - "default,transport-memory"   # With the in-memory transport adapter

# Testing
test:
  enabled: true
  coverage: true
  rust:
    # Required, not auto: the DLQ-refusal tests set a process-wide RLIMIT_FSIZE of 0, and only nextest keeps each test in a process of its own.
    nextest: true
  # min_coverage: 80       # Fail if coverage below this percentage

# Building
build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app                # Build binaries (not just crate)
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go)
release:
  enabled: true
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
