# HyperI CI Configuration
# Generated by: attach.sh
# Documentation: https://github.com/hyperi-io/ci/blob/main/docs/CONFIGURATION.md
#
# Configuration precedence (highest wins):
#   1. Environment variables (HYPERCI_*)
#   2. This file (.hyperi-ci.yaml)
#   3. ci/defaults.yaml (CI defaults)

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-runner-16cpu

# Quality checks
quality:
  enabled: true
  # Rust: test specific feature sets (avoids --all-features conflicts with mutually exclusive features)
  rust:
    features:
      - "default"                    # Default features
      - "default,jemalloc"           # With jemalloc allocator
      - "default,mimalloc"           # With mimalloc allocator
      - "default,http"               # With HTTP transport

# Testing
test:
  enabled: true
  coverage: true
  # min_coverage: 80       # Fail if coverage below this percentage

# Building
build:
  enabled: true
  type: app                # Build binaries (not just crate)
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Publishing (on release)
publish:
  enabled: true
  binaries: both           # Binary publish destination: artifactory, github, both
  # binaries_repo: hyperi-binaries  # JFrog Generic repo for binaries
