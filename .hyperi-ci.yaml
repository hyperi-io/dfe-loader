# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, bash, none
language: rust

# Runner settings (override GH_RUNNER_* variables)
runners:
  default: arc-runner-16cpu

# Quality checks
quality:
  enabled: true
  # Rust: test specific feature sets (avoids --all-features conflicts).
  # DFE policy 2026-04-17 — jemalloc only; mimalloc removed.
  rust:
    features:
      - "default"                    # Default features
      - "default,jemalloc"           # With jemalloc allocator
      - "default,testcontainers"     # With testcontainers integration tests

# Testing
test:
  enabled: true
  coverage: true
  # min_coverage: 80       # Fail if coverage below this percentage

# Building
build:
  enabled: true
  type: app                # Build binaries (not just crate)
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Release-track build optimisation (hyperi-ci Tier 1/2).
    # Channel-gated defaults apply automatically:
    #   spike/alpha → jemalloc + thin LTO
    #   beta        → jemalloc + fat LTO
    #   release     → jemalloc + fat LTO + PGO/BOLT (opt-in below)
    # See docs/performance/OVERVIEW.md and hyperi-ci's
    # docs/RUST-RELEASE-TRACK-OPTIMISATION.md for the full contract.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

# Publishing (on release)
publish:
  enabled: true
  # target=both maps to the release channel which unlocks Tier 2 PGO+BOLT
  # (target=internal resolves to spike channel — Tier 1 only).
  target: both
  binaries: both
  container:
    enabled: true
    registry: jfrog
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
    registry: jfrog
