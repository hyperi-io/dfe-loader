[package]
name = "dfe-loader"
version = "1.18.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Loads Kafka and gRPC streams into ClickHouse, batching small writes into large inserts. Runs standalone or as part of the HyperI Data Fusion Engine."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-loader"
rust-version = "1.95"
exclude = ["ci/", "docs/", "reference/", "scripts/"]

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "dfe-loader"
path = "src/main.rs"

# PGO workload driver — Kafka producer that drives realistic load against a
# running dfe-loader during hyperi-ci Tier 2 PGO/BOLT builds.
# `required-features` keeps it out of default builds; hyperi-ci ≥v1.9.2
# respects this and skips the binary in detect-build-config.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime
tokio = { version = ">=1.53.1, <2", features = ["full"] }
tokio-util = { version = ">=0.7.19, <0.8", features = ["rt"] }

# Shared library with transport abstraction. The floor is the first release with
# KafkaTransport::lease, which the flush checks before writing buffered rows.
scalo = { version = ">=2.13.2, <3", features = ["config-schema", "transport-kafka", "transport-grpc", "dlq-kafka", "config", "config-reload", "deployment", "version-check", "scaling", "cli-service", "top", "logger", "metrics", "service-metrics", "expression", "memory", "worker-batch", "governor", "secrets", "sink-stack"] }

# Steps scalo's jittered retry schedule (sink_stack backoff). Range MUST track
# scalo's: BackoffBuilder only applies to the ExponentialBuilder scalo returns.
backon = { version = ">=1.6.0, <2", default-features = false, features = ["std"] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.2, <2", default-features = false, features = ["std", "derive", "preserve_order", "indexmap2"] }

# CEL expression evaluation (same crate scalo uses, needed for Program type).
# Range MUST track scalo's, which is `>=0.13, <0.14`: we hand cel::Program across
# the scalo boundary, so a wider range here lets cargo resolve two semver-
# incompatible cels and Program stops being the same type. cel 0.14 also breaks
# Type, Env and FunctionContext. In ignoreDeps until scalo moves first.
cel = { version = ">=0.13, <0.14", features = ["json"] }

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5.10, <0.6"
serde = { version = ">=1.0.229, <2", features = ["derive"] }
serde_json = ">=1.0.151, <2"  # Fallback for complex cases
serde_yaml_ng = ">=0.10, <0.11"  # YAML remap file parsing (maintained serde_yaml fork)
csv = ">=1.4.0, <2"  # CSV remap file parsing (ecs-mapper format compatible)

# Configuration
figment = { version = ">=0.10.19, <0.11", features = ["env"] }
clap = { version = ">=4.6.7, <5", features = ["derive", "env"] }
dotenvy = ">=0.15.7, <0.16"

# Error handling
thiserror = ">=2.0.20, <3"

# Logging & metrics
tracing = ">=0.1.44, <0.2"
metrics = ">=0.24.6, <0.25"

# Memory management - jemalloc allocator (DFE policy 2026-04-17: jemalloc only)
# `stats` builds jemalloc with --enable-stats; without it there is no
# stats.allocated for the memory guard's heap source to read (#162).
tikv-jemalloc-ctl = { version = ">=0.7.0, <0.8", optional = true, features = ["stats"] }
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }

# GeoIP enrichment (mmap for long-running apps)
maxminddb = { version = ">=0.32.0, <0.33", features = ["mmap"] }

# GeoIP auto-download (HTTP + gzip decompression + tar extraction)
# Pinned to 0.12 to match scalo (reqwest-middleware/vaultrs don't support 0.13 yet)
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
flate2 = ">=1.1.10, <2"
tar = ">=0.4.46, <0.5"

# ClickHouse crate (HyperI fork with native TCP + unified client)
# rustls-tls: HTTPS for HTTP transport
# native-transport + native-tls-rustls: native TCP with TLS
# rustls-tls-native-roots: uses system trust store for internal CAs
clickhouse = { version = ">=0.15.0, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "tcp", "native-tls-rustls", "inserter"] }
time = ">=0.3.55, <0.4"

# Utilities
uuid = { version = ">=1.26.1, <2", features = ["v4", "v7"] }
rustc-hash = ">=2.1.3, <3"  # FxHashMap - faster hashing for internal maps
memchr = ">=2.8.3, <3"     # SIMD byte scanning for directive parser
# Kafka auto-discovery filters are regexes in scalo; escape() keeps a DLQ topic
# name literal. Same crate scalo resolves, so cargo unifies to one regex.
regex = ">=1.13.1, <2"
compact_str = ">=0.10.0, <0.11"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4.45, <0.5", features = ["serde"] }
bytes = ">=1.12.1, <2"
futures = ">=0.3.34, <0.4"
parking_lot = ">=0.12.5, <0.13"
crossbeam-channel = ">=0.5.17, <0.6"
indexmap = { version = ">=2.14.2, <3", features = ["serde"] }

# File watching (config hot-reload) - using polling for S3/NFS/FUSE compatibility
# notify = ">=6.1"  # Not needed - polling works on all filesystems

# PGO workload driver — Kafka producer for hyperi-ci Tier 2 PGO/BOLT builds.
# Optional, gated by the `pgo-driver` feature. Main loader binary doesn't link it.
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"], optional = true }

[dev-dependencies]
# Testing
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
proptest = ">=1.11.0, <2"
test-case = ">=3.3.1, <4"

# Blocking HTTP for sync test reachability probes (skip_if_no_clickhouse macro).
# Adds the `blocking` feature to the reqwest already-pinned by the lib.
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

# Integration test containers
testcontainers = ">=0.27.3, <0.28"
testcontainers-modules = { version = ">=0.15.0, <0.16", features = ["kafka", "clickhouse"] }
# The reqwest major testcontainers' HttpWaitStrategy::with_client takes; the lib stays on 0.12 for scalo.
testcontainers-reqwest = { package = "reqwest", version = ">=0.13.5, <0.14", default-features = false }

# Kafka producer for e2e tests (test message injection)
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"] }

# ClickHouse crate (HyperI fork) — integration tests need all features
clickhouse = { version = ">=0.15.0, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "tcp", "native-tls-rustls", "inserter"] }
time = ">=0.3.55, <0.4"

# Async test utilities
tokio-test = ">=0.4.5, <0.5"
tempfile = ">=3.27.0, <4"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "insert_bakeoff"
harness = false

[[bench]]
name = "extractor"
harness = false

[[bench]]
name = "json_depth"
harness = false

[profile.release]
lto = "thin"           # Link-time optimization (use "fat" for max perf, slower compile)
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # Smaller binary, no unwinding overhead
strip = true           # Remove debug symbols
opt-level = 3          # Maximum optimization (default for release, explicit for clarity)

# =============================================================================
# Advanced Optimization Options (Manual)
# =============================================================================
#
# 1. Profile-Guided Optimization (PGO) - 10-20% improvement:
#    cargo install cargo-pgo
#    cargo pgo build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader  # Run with real workload
#    cargo pgo optimize
#
# 2. BOLT Post-Link Optimization (additional 5-15% on top of PGO):
#    cargo pgo bolt build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader-bolt-instrumented  # Run workload
#    cargo pgo bolt optimize
#
# 3. Combined PGO + BOLT:
#    cargo pgo optimize
#    cargo pgo bolt optimize --with-pgo
#
# 4. Fat LTO (slower compile, sometimes faster runtime):
#    Change lto = "thin" to lto = "fat"
#
# References:
# - https://github.com/Kobzol/cargo-pgo
# - https://nnethercote.github.io/perf-book/build-configuration.html

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
# Tests require unsafe for env::set_var/remove_var (edition 2024).
# Production code has zero unsafe blocks — the lib target is clean.
unsafe_code = "allow"
# `#[cfg(tarpaulin)]` is set by cargo-tarpaulin at coverage time. Declaring
# it here silences `unexpected_cfgs` without a build.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
# Some clippy allows below are 1.95+-only (e.g. `duration_suboptimal_units`).
# 1.94 toolchains would otherwise fail with `unknown lint`.
unknown_lints = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# unwrap/expect: allow globally because unit tests (#[cfg(test)] in lib) use them
# extensively and CI runs -D warnings. New prod code should use ? instead.
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Dynamic Map<String, Value> patterns need flexible casting
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
# Pre-existing patterns that are not bugs
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
doc_link_with_quotes = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
match_same_arms = "allow"
redundant_else = "allow"
default_trait_access = "allow"
assigning_clones = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_futures = "allow"
format_push_string = "allow"
float_cmp = "allow"
# Tests use `let mut cfg = X::default(); cfg.field = ...` for readability over
# struct-init. Production code is unaffected.
field_reassign_with_default = "allow"
# Test data sometimes uses literal 3.14 etc. for clarity over `std::f64::consts::PI`.
approx_constant = "allow"
# A handful of test/utility helpers exceed the default 7-arg threshold.
too_many_arguments = "allow"
# Mostly affects internal types in benches/tests where TupleX is fine.
type_complexity = "allow"
# `&Option<T>` appears in a few config setters where call-site ergonomics
# (`set_x(&self.x)`) outweigh the API guideline.
ref_option = "allow"
# Tests use `Duration::from_millis(30000)` etc. for symmetry with config
# values stored in millis. Style-only.
duration_suboptimal_units = "allow"
# `.map(|x| ...).unwrap_or(false)` is clearer than `.is_ok_and()` for some
# readers. Stylistic.
map_unwrap_or = "allow"

# =============================================================================
# clickhouse-rs Fork Swap (hyperi-io/clickhouse-rs)
# =============================================================================
#
# dfe-loader is the test harness for the HyperI clickhouse-rs fork.
# Swap mechanism: uncomment [patch] below to activate the fork.
# Zero change to [dependencies] — the patch overrides the crates.io version.
#
# Fork branch chain (merge order — test each in dfe-loader before merging next):
#   native-transport → connection-pooling → lc-insert → async-inserter → optimise-1
#   batching and remediation are independent (mergeable to upstream anytime)
#
# Branch structure:
#   main (upstream v0.14.2)
#   ├── hyperi/remediation-deps — Drop fxhash + linked-hash-map (RUSTSEC-2025-0057)
#   │   └── hyperi/remediation-polonius — Drop polonius-the-crab (RUSTSEC-2024-0436)
#   ├── hyperi/native-transport — Native TCP SELECT + INSERT, full type coverage
#   │   └── hyperi/connection-pooling — Deadpool pool, cursor drain, health checks
#   │       └── hyperi/lc-insert — LowCardinality INSERT + LC(Nullable) reader fix
#   │           └── hyperi/async-inserter — AsyncInserter (HTTP + native), TableBatcher
#   │               └── hyperi/optimise-1 — DynamicInsert, ParsedType, schema recovery
#   └── hyperi/batching — HTTP TableBatcher (independent)
#
# optimise-1 has remediation-polonius merged in (no code overlap, clean merge)
# so dfe-loader gets both feature work and dep remediation from one checkout.
#
# Design spec: docs/specs/2026-03-18-clickhouse-rs-fork-swap.md
#
[patch.crates-io]
# hyperi/connection-actor stacks on hyperi/schema-cache-strong with the
# socket-state actor work — every native-transport operation goes through
# a background actor task with protocol-level Cancel-on-drop, full-duplex
# INSERT exception detection, and idle keepalive. See the fork's
# src/worker/ + src/native/connection_actor.rs for design + rationale.
# Pinned to the hyperi-port/06d-tcp-tls-new branch tip for a reproducible
# build (a sha, not a floating branch ref).
clickhouse = { git = "https://github.com/hyperi-io/clickhouse-rs.git", rev = "6f9acd9694acc9c596ff687c908aa215af100887" }
#
# To revert: comment out or remove the [patch.crates-io] section above.
# =============================================================================

[features]
default = []
# Allocator (DFE policy 2026-04-17: jemalloc at every channel, no mimalloc)
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Transport backends
transport-memory = ["scalo/transport-memory"]  # Memory transport for unit tests
# Testing
testcontainers = []  # Enable testcontainers for CI/CD (Docker required)
# PGO workload driver (hyperi-ci Tier 2 — see scripts/pgo-workload.sh)
# Pulls in rdkafka for the producer binary; main loader binary is unaffected.
pgo-driver = ["dep:rdkafka"]
