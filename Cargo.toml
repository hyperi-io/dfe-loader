[package]
name = "dfe-loader"
version = "1.3.1"
edition = "2021"
authors = ["Hypersec"]
description = "High-performance Kafka to ClickHouse data loader"
license = "Proprietary"
rust-version = "1.75"

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "loader"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.48", features = ["full"] }
tokio-util = { version = ">=0.7", features = ["rt"] }

# Transport abstraction (Kafka/Zenoh/Memory) from hs-rustlib
# Published to Artifactory hypersec-cargo registry
hs-rustlib = { version = "0.2.0", registry = "hypersec", features = ["transport-kafka"] }

# Kafka (SASL/SCRAM required for auth) - also needed for DLQ producer
rdkafka = { version = ">=0.38", features = ["cmake-build", "ssl", "sasl"] }

# ClickHouse Arrow client - using local fork with Variant/Dynamic/Nested types
# Native Arrow protocol for efficient columnar inserts
clickhouse-arrow = { path = "crates/clickhouse-arrow/clickhouse-arrow", default-features = false, features = ["serde", "pool"] }

# Arrow for columnar data handling
arrow = { version = ">=54.0", features = ["prettyprint"] }
arrow-json = ">=54.0"  # JSON to Arrow conversion (SIMD)

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5"
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"  # Fallback for complex cases

# MessagePack parsing
rmp-serde = ">=1.3"

# Configuration
config = ">=0.14"
clap = { version = ">=4.5", features = ["derive", "env"] }
dotenvy = ">=0.15"

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0"

# Logging & metrics
tracing = ">=0.1"
tracing-subscriber = { version = ">=0.3", features = ["env-filter", "json"] }
prometheus = ">=0.14"
hyper = { version = ">=1.8", features = ["server", "http1"] }
hyper-util = { version = ">=0.1", features = ["tokio"] }
http-body-util = ">=0.1"

# Memory management
tikv-jemalloc-ctl = ">=0.6"
tikv-jemallocator = ">=0.6"

# GeoIP enrichment (mmap for long-running apps, simdutf8 for SIMD UTF-8 validation)
maxminddb = { version = ">=0.24", features = ["mmap", "simdutf8"] }

# Utilities
uuid = { version = ">=1.10", features = ["v4", "v7"] }
rustc-hash = ">=2.0"  # FxHashMap - faster hashing for internal maps
compact_str = ">=0.8"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4", features = ["serde"] }
chrono-tz = ">=0.9"
bytes = ">=1.7"
futures = ">=0.3"
parking_lot = ">=0.12"
dashmap = ">=6.0"
crossbeam-channel = ">=0.5"
indexmap = { version = ">=2.5", features = ["serde"] }

# Graceful shutdown
tokio-graceful-shutdown = ">=0.15"

# File watching (config hot-reload) - using polling for S3/NFS/FUSE compatibility
# notify = ">=6.1"  # Not needed - polling works on all filesystems

# Async traits
trait-variant = ">=0.1"

[dev-dependencies]
# Testing
criterion = { version = ">=0.8", features = ["html_reports"] }
proptest = ">=1.5"
test-case = ">=3.3"
rstest = ">=0.22"
mockall = ">=0.13"

# Integration test containers
testcontainers = ">=0.26"
testcontainers-modules = { version = ">=0.10", features = ["kafka", "clickhouse"] }

# Async test utilities
tokio-test = ">=0.4"
tempfile = ">=3.10"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "mison"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[features]
default = []
jemalloc = []  # Enable jemalloc allocator
transport-memory = ["hs-rustlib/transport-memory"]  # Memory transport for unit tests
transport-zenoh = ["hs-rustlib/transport-zenoh"]    # Zenoh transport for dev/test
testcontainers = []  # Enable testcontainers for CI/CD (Docker required)
