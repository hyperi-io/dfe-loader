[package]
name = "dfe-loader"
version = "1.14.1-dev.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "High-performance Kafka to ClickHouse data loader"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-loader"
rust-version = "1.94"
exclude = [".claude/", "ai/", "ci/", "docs/", "reference/", "scripts/", "schemas/"]

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "dfe-loader"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.48", features = ["full"] }
tokio-util = { version = ">=0.7", features = ["rt"] }

# Shared library with transport abstraction
hyperi-rustlib = { version = ">=1.16.6", features = ["transport-kafka", "transport-grpc", "dlq-kafka", "config", "config-reload", "deployment", "version-check", "scaling", "cli", "top", "logger", "metrics", "expression", "memory"] }

# CEL expression evaluation (same crate as rustlib uses, needed for Program type)
cel-interpreter = { version = ">=0.10.0, <0.11", features = ["json"] }

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5"
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"  # Fallback for complex cases
serde_yaml_ng = ">=0.10"  # YAML remap file parsing (maintained serde_yaml fork)
csv = ">=1.3"  # CSV remap file parsing (ecs-mapper format compatible)

# MessagePack parsing
rmp-serde = ">=1.3"

# Configuration
figment = { version = ">=0.10", features = ["env"] }
clap = { version = ">=4.5", features = ["derive", "env"] }
dotenvy = ">=0.15"

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0"

# Logging & metrics
tracing = ">=0.1"
metrics = ">=0.24"

# Memory management - alternative allocators for performance
# jemalloc: Good for long-running servers with large allocations
tikv-jemalloc-ctl = { version = ">=0.6", optional = true }
tikv-jemallocator = { version = ">=0.6", optional = true }
# mimalloc: Often faster for mixed workloads, better security hardening
mimalloc = { version = ">=0.1", optional = true }

# GeoIP enrichment (mmap for long-running apps, simdutf8 for SIMD UTF-8 validation)
maxminddb = { version = ">=0.24", features = ["mmap", "simdutf8"] }

# GeoIP auto-download (HTTP + gzip decompression + tar extraction)
reqwest = { version = ">=0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
flate2 = ">=1.0"
tar = ">=0.4"

# ClickHouse official crate (HTTP/RowBinary for DDL and schema queries)
# rustls-tls: enables HTTPS; rustls-tls-native-roots: uses system trust store for HyperI DevEx Root CA
clickhouse = { version = ">=0.14", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots"] }
time = ">=0.3"

# Utilities
uuid = { version = ">=1.10", features = ["v4", "v7"] }
rustc-hash = ">=2.0"  # FxHashMap - faster hashing for internal maps
memchr = ">=2.0"     # SIMD byte scanning for directive parser
compact_str = ">=0.8"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4", features = ["serde"] }
chrono-tz = ">=0.9"
bytes = ">=1.7"
futures = ">=0.3"
parking_lot = ">=0.12"
dashmap = ">=6.0"
crossbeam-channel = ">=0.5"
indexmap = { version = ">=2.5", features = ["serde"] }
regex = ">=1.10"  # Topic include/exclude pattern matching

# Graceful shutdown
tokio-graceful-shutdown = ">=0.15"

# File watching (config hot-reload) - using polling for S3/NFS/FUSE compatibility
# notify = ">=6.1"  # Not needed - polling works on all filesystems

# Async traits
trait-variant = ">=0.1"

[dev-dependencies]
# Testing
criterion = { version = ">=0.8", features = ["html_reports"] }
proptest = ">=1.5"
test-case = ">=3.3"
rstest = ">=0.22"

# Integration test containers
testcontainers = ">=0.26"
testcontainers-modules = { version = ">=0.10", features = ["kafka", "clickhouse"] }

# ClickHouse official crate (HTTP/RowBinary) — bakeoff comparison vs JSONEachRow path
clickhouse = { version = ">=0.14", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots"] }
time = ">=0.3"

# Async test utilities
tokio-test = ">=0.4"
tempfile = ">=3.10"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "insert_bakeoff"
harness = false

[profile.release]
lto = "thin"           # Link-time optimization (use "fat" for max perf, slower compile)
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # Smaller binary, no unwinding overhead
strip = true           # Remove debug symbols
opt-level = 3          # Maximum optimization (default for release, explicit for clarity)

# =============================================================================
# Advanced Optimization Options (Manual)
# =============================================================================
#
# 1. Profile-Guided Optimization (PGO) - 10-20% improvement:
#    cargo install cargo-pgo
#    cargo pgo build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader  # Run with real workload
#    cargo pgo optimize
#
# 2. BOLT Post-Link Optimization (additional 5-15% on top of PGO):
#    cargo pgo bolt build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader-bolt-instrumented  # Run workload
#    cargo pgo bolt optimize
#
# 3. Combined PGO + BOLT:
#    cargo pgo optimize
#    cargo pgo bolt optimize --with-pgo
#
# 4. Fat LTO (slower compile, sometimes faster runtime):
#    Change lto = "thin" to lto = "fat"
#
# References:
# - https://github.com/Kobzol/cargo-pgo
# - https://nnethercote.github.io/perf-book/build-configuration.html

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
# Tests require unsafe for env::set_var (edition 2024). Warn, not deny/forbid.
# CI can enforce stricter for lib: cargo clippy --lib -- -D unsafe_code
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# These are too strict for a codebase with dynamic Map<String, Value> patterns
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

# =============================================================================
# clickhouse-rs Fork Swap (hyperi-io/clickhouse-rs)
# =============================================================================
#
# dfe-loader is the test harness for the HyperI clickhouse-rs fork.
# Swap mechanism: uncomment [patch] below to activate the fork.
# Zero change to [dependencies] — the patch overrides the crates.io version.
#
# Fork branch chain (merge order — test each in dfe-loader before merging next):
#   native-transport → connection-pooling → lc-insert → async-inserter → optimise-1
#   batching and remediation are independent (mergeable to upstream anytime)
#
# Branch structure:
#   main (upstream v0.14.2)
#   ├── hyperi/remediation-deps — Drop fxhash + linked-hash-map (RUSTSEC-2025-0057)
#   │   └── hyperi/remediation-polonius — Drop polonius-the-crab (RUSTSEC-2024-0436)
#   ├── hyperi/native-transport — Native TCP SELECT + INSERT, full type coverage
#   │   └── hyperi/connection-pooling — Deadpool pool, cursor drain, health checks
#   │       └── hyperi/lc-insert — LowCardinality INSERT + LC(Nullable) reader fix
#   │           └── hyperi/async-inserter — AsyncInserter (HTTP + native), TableBatcher
#   │               └── hyperi/optimise-1 — DynamicInsert, ParsedType, schema recovery
#   └── hyperi/batching — HTTP TableBatcher (independent)
#
# optimise-1 has remediation-polonius merged in (no code overlap, clean merge)
# so dfe-loader gets both feature work and dep remediation from one checkout.
#
# Design spec: docs/specs/2026-03-18-clickhouse-rs-fork-swap.md
#
[patch.crates-io]
clickhouse = { git = "https://github.com/hyperi-io/clickhouse-rs.git", branch = "hyperi/optimise-1" }
#
# To revert: comment out or remove the [patch.crates-io] section above.
# =============================================================================

[features]
default = []
# Alternative allocators (choose one for production)
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]  # Best for large allocations, long-running
mimalloc = ["dep:mimalloc"]  # Often faster, better security, consistent performance
# Transport backends
transport-memory = ["hyperi-rustlib/transport-memory"]  # Memory transport for unit tests
# Testing
testcontainers = []  # Enable testcontainers for CI/CD (Docker required)
