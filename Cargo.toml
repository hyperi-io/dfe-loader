[package]
name = "dfe-loader"
version = "1.18.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Loads Kafka and gRPC streams into ClickHouse, batching small writes into large inserts. Runs standalone or as part of the HyperI Data Fusion Engine."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-loader"
rust-version = "1.95"
exclude = ["ci/", "docs/", "reference/", "scripts/"]

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "dfe-loader"
path = "src/main.rs"

# PGO workload driver — Kafka producer that drives realistic load against a
# running dfe-loader during hyperi-ci Tier 2 PGO/BOLT builds.
# `required-features` keeps it out of default builds; hyperi-ci ≥v1.9.2
# respects this and skips the binary in detect-build-config.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime
tokio = { version = ">=1.54.1, <2", features = ["full"] }
tokio-util = { version = ">=0.7.20, <0.8", features = ["rt"] }

# Shared library with transport abstraction. The floor moves with
# `release.helm.library` in .hyperi-ci.yaml: the library renders only the
# contract version its scalo release writes.
scalo = { version = ">=2.14.25, <3", features = ["config-schema", "transport-kafka", "transport-grpc", "dlq-kafka", "config", "config-reload", "deployment", "version-check", "scaling", "cli-service", "top", "logger", "metrics", "service-metrics", "expression", "memory", "worker-batch", "governor", "secrets", "sink-stack", "geoip-download"] }

# Steps scalo's jittered retry schedule (sink_stack backoff). Range MUST track
# scalo's: BackoffBuilder only applies to the ExponentialBuilder scalo returns.
backon = { version = ">=1.6.0, <2", default-features = false, features = ["std"] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order", "indexmap2"] }

# CEL expression evaluation (same crate scalo uses, needed for Program type).
# Range MUST track scalo's, which is `>=0.14.5, <0.15`: we hand cel::Program across
# the scalo boundary, so a wider range here lets cargo resolve two semver-
# incompatible cels and Program stops being the same type. In ignoreDeps so it
# moves only with scalo.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5.10, <0.6"
serde = { version = ">=1.0.229, <2", features = ["derive"] }
serde_json = ">=1.0.154, <2"  # Fallback for complex cases
csv = ">=1.4.0, <2"  # CSV remap file parsing (ecs-mapper format compatible)

# Configuration
figment = { version = ">=0.10.19, <0.11", features = ["env"] }
clap = { version = ">=4.6.7, <5", features = ["derive", "env"] }

# Error handling
thiserror = ">=2.0.21, <3"

# Logging & metrics
tracing = ">=0.1.44, <0.2"
metrics = ">=0.24.6, <0.25"

# Memory management - jemalloc allocator (DFE policy 2026-04-17: jemalloc only)
# `stats` builds jemalloc with --enable-stats; without it there is no
# stats.allocated for the memory guard's heap source to read (#162).
tikv-jemalloc-ctl = { version = ">=0.7.0, <0.8", optional = true, features = ["stats"] }
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }

# GeoIP enrichment (mmap for long-running apps). scalo's geoip-download provisions the files.
maxminddb = { version = ">=0.32.0, <0.33", features = ["mmap"] }

# The official ClickHouse HTTP client. rustls-tls + rustls-tls-native-roots:
# HTTPS for clients built with Client::default().
clickhouse = { version = ">=0.15.3, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "inserter"] }
# `ext` reads the server's exception code out of an HTTP rejection; `tls`
# (implies `tcp`) is the native-protocol client, rustls only.
dfe-clickhouse = { version = ">=0.1.9, <0.2", default-features = false, features = ["ext", "tls", "dynamic"] }
time = ">=0.3.55, <0.4"

# The HTTP client handed to clickhouse::Client::with_http_client: connect timeout,
# idle-pool eviction and HTTPS verified against the system trust store.
hyper-util = { version = ">=0.1.21, <0.2", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = ">=0.27.10, <0.28", default-features = false, features = ["http1", "tls12", "native-tokio", "aws-lc-rs"] }
rustls = { version = ">=0.23.46, <0.24", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

# Utilities
uuid = { version = ">=1.29.0, <2", features = ["v4", "v7"] }
rustc-hash = ">=2.1.3, <3"  # FxHashMap - faster hashing for internal maps
memchr = ">=2.8.3, <3"     # SIMD byte scanning for directive parser
# Kafka auto-discovery filters are regexes in scalo; escape() keeps a DLQ topic
# name literal. Same crate scalo resolves, so cargo unifies to one regex.
regex = ">=1.13.1, <2"
compact_str = ">=0.10.0, <0.11"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4.45, <0.5", features = ["serde"] }
bytes = ">=1.12.1, <2"
futures = ">=0.3.34, <0.4"
parking_lot = ">=0.13.0, <0.14"
crossbeam-channel = ">=0.5.17, <0.6"
indexmap = { version = ">=2.14.2, <3", features = ["serde"] }

# File watching (config hot-reload) - using polling for S3/NFS/FUSE compatibility
# notify = ">=6.1"  # Not needed - polling works on all filesystems

# PGO workload driver — Kafka producer for hyperi-ci Tier 2 PGO/BOLT builds.
# Optional, gated by the `pgo-driver` feature. Main loader binary doesn't link it.
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"], optional = true }

[dev-dependencies]
# Testing
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
proptest = ">=1.12.0, <2"
test-case = ">=3.4.0, <4"

# Blocking HTTP for sync test reachability probes (ClickHouseTestConfig::is_reachable).
# Held on 0.12: 0.13 drops the rustls-tls-native-roots feature.
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

# The Kafka broker image pin and the TLS / mTLS / SASL_SSL broker fixture the
# Kafka tests share, so neither is copied here. The production dependency above
# does not carry this feature.
scalo = { version = ">=2.14.25, <3", features = ["transport-kafka-test-support"] }

# The status code a raw Push is refused with, through scalo's generated gRPC
# client. Same range as the copy scalo resolves, so cargo unifies to one.
tonic = { version = ">=0.14.8, <0.15", default-features = false }

# Kafka producer for e2e tests (test message injection)
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"] }

# ClickHouse crate -- integration tests need all features
clickhouse = { version = ">=0.15.3, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "inserter"] }
time = ">=0.3.55, <0.4"

# Private CA and server certificates for the TLS ClickHouse tests
rcgen = ">=0.14.10, <0.15"

# Async test utilities
tokio-test = ">=0.4.6, <0.5"

# Sends the loader's tracing output through the test harness's capture. Same
# range as the copy scalo resolves, so cargo unifies to one.
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["env-filter"] }
tempfile = ">=3.27.0, <4"

# The repo's own .env for live-service tests and benches. The binary's .env is read by scalo's cascade.
dotenvy = ">=0.15.7, <0.16"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "insert_bakeoff"
harness = false

[[bench]]
name = "extractor"
harness = false

[[bench]]
name = "json_depth"
harness = false

[profile.release]
lto = "thin"           # Link-time optimization (use "fat" for max perf, slower compile)
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # Smaller binary, no unwinding overhead
strip = true           # Remove debug symbols
opt-level = 3          # Maximum optimization (default for release, explicit for clarity)

# =============================================================================
# Advanced Optimization Options (Manual)
# =============================================================================
#
# 1. Profile-Guided Optimization (PGO) - 10-20% improvement:
#    cargo install cargo-pgo
#    cargo pgo build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader  # Run with real workload
#    cargo pgo optimize
#
# 2. BOLT Post-Link Optimization (additional 5-15% on top of PGO):
#    cargo pgo bolt build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader-bolt-instrumented  # Run workload
#    cargo pgo bolt optimize
#
# 3. Combined PGO + BOLT:
#    cargo pgo optimize
#    cargo pgo bolt optimize --with-pgo
#
# 4. Fat LTO (slower compile, sometimes faster runtime):
#    Change lto = "thin" to lto = "fat"
#
# References:
# - https://github.com/Kobzol/cargo-pgo
# - https://nnethercote.github.io/perf-book/build-configuration.html

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
# Tests require unsafe for env::set_var/remove_var (edition 2024).
# Production code has zero unsafe blocks — the lib target is clean.
unsafe_code = "allow"
# `#[cfg(tarpaulin)]` is set by cargo-tarpaulin at coverage time. Declaring
# it here silences `unexpected_cfgs` without a build.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
# Some clippy allows below are 1.95+-only (e.g. `duration_suboptimal_units`).
# 1.94 toolchains would otherwise fail with `unknown lint`.
unknown_lints = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# 117 doc comments name ClickHouse types and columns without backticks.
doc_markdown = "allow"
# 41 public Result fns have no # Errors section, and 4 no # Panics section.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 16 sites.
items_after_statements = "allow"
# 13 methods would become associated functions, which rewrites every caller.
unused_self = "allow"
# 10 sites, and changing a signature rewrites its callers.
needless_pass_by_value = "allow"
# 9 sites.
unreadable_literal = "allow"
# 8 sites.
doc_link_with_quotes = "allow"
# 7 sites.
match_same_arms = "allow"
# 5 sites.
struct_excessive_bools = "allow"
# 4 functions run long, the largest at 665 lines, and splitting them needs its own change.
too_many_lines = "allow"
# 4 sites, and boxing a future changes the hot path, which needs a measurement first.
large_futures = "allow"
# 3 sites.
similar_names = "allow"
# 3 sites.
trivially_copy_pass_by_ref = "allow"
# 2 sites.
unused_async = "allow"
# 20 sites, all in tests/.
manual_let_else = "allow"
# 8 sites, all in tests/.
default_trait_access = "allow"
# 7 sites, all in tests/.
format_push_string = "allow"
# Dynamic Map<String, Value> patterns need flexible casting
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
# Tests use `let mut cfg = X::default(); cfg.field = ...` for readability over
# struct-init. Production code is unaffected.
field_reassign_with_default = "allow"
# Test data sometimes uses literal 3.14 etc. for clarity over `std::f64::consts::PI`.
approx_constant = "allow"
# A handful of test/utility helpers exceed the default 7-arg threshold.
too_many_arguments = "allow"
# Mostly affects internal types in benches/tests where TupleX is fine.
type_complexity = "allow"
# `&Option<T>` appears in a few config setters where call-site ergonomics
# (`set_x(&self.x)`) outweigh the API guideline.
ref_option = "allow"
# Tests use `Duration::from_millis(30000)` etc. for symmetry with config
# values stored in millis. Style-only.
duration_suboptimal_units = "allow"
# `.map(|x| ...).unwrap_or(false)` is clearer than `.is_ok_and()` for some
# readers. Stylistic.
map_unwrap_or = "allow"

[features]
default = []
# Allocator (DFE policy 2026-04-17: jemalloc at every channel, no mimalloc)
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Transport backends
transport-memory = ["scalo/transport-memory"]  # Memory transport for unit tests
# Testing
testcontainers = []  # The tests that run real ClickHouse and Kafka containers (Docker required)
# PGO workload driver (hyperi-ci Tier 2 — see scripts/pgo-workload.sh)
# Pulls in rdkafka for the producer binary; main loader binary is unaffected.
pgo-driver = ["dep:rdkafka"]
