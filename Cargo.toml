[package]
name = "dfe-loader"
version = "1.18.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Loads Kafka and gRPC streams into ClickHouse, batching small writes into large inserts. Runs standalone or as part of the HyperI Data Fusion Engine."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-loader"
rust-version = "1.95"
exclude = ["ci/", "docs/", "reference/", "scripts/"]

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "dfe-loader"
path = "src/main.rs"

# PGO workload driver — Kafka producer that drives realistic load against a
# running dfe-loader during hyperi-ci Tier 2 PGO/BOLT builds.
# `required-features` keeps it out of default builds; hyperi-ci ≥v1.9.2
# respects this and skips the binary in detect-build-config.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime
tokio = { version = ">=1.48, <2", features = ["full"] }
tokio-util = { version = ">=0.7, <0.8", features = ["rt"] }

# Shared library with transport abstraction
scalo = { version = ">=2.10.14, <3", features = ["config-schema", "transport-kafka", "transport-grpc", "dlq-kafka", "config", "config-reload", "deployment", "version-check", "scaling", "cli-service", "top", "logger", "metrics", "service-metrics", "expression", "memory", "worker-batch", "governor", "secrets"] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order", "indexmap2"] }

# CEL expression evaluation (same crate scalo uses, needed for Program type).
# Range MUST track scalo's, which is `>=0.13, <0.14`: we hand cel::Program across
# the scalo boundary, so a wider range here lets cargo resolve two semver-
# incompatible cels and Program stops being the same type. cel 0.14 also breaks
# Type, Env and FunctionContext. In ignoreDeps until scalo moves first.
cel = { version = ">=0.13, <0.14", features = ["json"] }

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5, <0.6"
serde = { version = ">=1.0, <2", features = ["derive"] }
serde_json = ">=1.0, <2"  # Fallback for complex cases
serde_yaml_ng = ">=0.10, <0.11"  # YAML remap file parsing (maintained serde_yaml fork)
csv = ">=1.3, <2"  # CSV remap file parsing (ecs-mapper format compatible)

# MessagePack parsing
rmp-serde = ">=1.3, <2"

# Configuration
figment = { version = ">=0.10, <0.11", features = ["env"] }
clap = { version = ">=4.5, <5", features = ["derive", "env"] }
dotenvy = ">=0.15, <0.16"

# Error handling
thiserror = ">=2.0, <3"
anyhow = ">=1.0, <2"

# Logging & metrics
tracing = ">=0.1, <0.2"
metrics = ">=0.24, <0.25"

# Memory management - jemalloc allocator (DFE policy 2026-04-17: jemalloc only)
tikv-jemalloc-ctl = { version = ">=0.7.0, <0.8", optional = true }
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }

# GeoIP enrichment (mmap for long-running apps, simdutf8 for SIMD UTF-8 validation)
maxminddb = { version = ">=0.28, <0.31", features = ["mmap", "simdutf8"] }

# GeoIP auto-download (HTTP + gzip decompression + tar extraction)
# Pinned to 0.12 to match scalo (reqwest-middleware/vaultrs don't support 0.13 yet)
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
flate2 = ">=1.0, <2"
tar = ">=0.4, <0.5"

# The published ClickHouse client plus HyperI's extension crate, which holds
# the native TCP transport, the unified client and the dynamic-schema insert.
# lz4 compresses HTTP responses, time backs the bench serde, rustls-tls with
# native roots covers the https:// URL and the internal CA.
clickhouse = { version = ">=0.15.2, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots"] }
clickhouse-dfe = { version = ">=0.1, <0.2", features = ["tls", "dynamic", "unified", "ext"] }
time = ">=0.3, <0.4"

# Reference-data enrichment: GeoIP databases and the generic table the
# blocklists are read through. Default features cover both -- `table` rides
# `geoip-download`, and `metrics` reports download outcomes and database age,
# which is the only signal a deployment has that its downloads stopped.
#
# `metrics-lookup` is deliberately NOT taken: factbook measures it at three to
# four times a cache hit, on the enrichment hot path, and nothing here consumed
# the old `CacheStats` outside its own tests.
factbook = ">=0.1, <0.2"

# Utilities
uuid = { version = ">=1.10, <2", features = ["v4", "v7"] }
rustc-hash = ">=2.0, <3"  # FxHashMap - faster hashing for internal maps
memchr = ">=2.0, <3"     # SIMD byte scanning for directive parser
compact_str = ">=0.9.1, <0.11"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4, <0.5", features = ["serde"] }
chrono-tz = ">=0.10.4, <0.11"
bytes = ">=1.7, <2"
futures = ">=0.3, <0.4"
parking_lot = ">=0.12, <0.13"
dashmap = ">=6.0, <7"
crossbeam-channel = ">=0.5, <0.6"
indexmap = { version = ">=2.5, <3", features = ["serde"] }

# Graceful shutdown
tokio-graceful-shutdown = ">=0.19.3, <0.20"

# File watching (config hot-reload) - using polling for S3/NFS/FUSE compatibility
# notify = ">=6.1"  # Not needed - polling works on all filesystems

# Async traits
trait-variant = ">=0.1, <0.2"

# PGO workload driver — Kafka producer for hyperi-ci Tier 2 PGO/BOLT builds.
# Optional, gated by the `pgo-driver` feature. Main loader binary doesn't link it.
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"], optional = true }

[dev-dependencies]
# Testing
criterion = { version = ">=0.8, <0.9", features = ["html_reports"] }
proptest = ">=1.5, <2"
test-case = ">=3.3, <4"
rstest = ">=0.26.1, <0.27"

# Blocking HTTP for sync test reachability probes (skip_if_no_clickhouse macro).
# Adds the `blocking` feature to the reqwest already-pinned by the lib.
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

# Integration test containers
testcontainers = ">=0.27.3, <0.28"
testcontainers-modules = { version = ">=0.15.0, <0.16", features = ["kafka", "clickhouse"] }

# Kafka producer for e2e tests (test message injection)
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"] }

# Integration tests name both crates directly, so they need their own entries.
clickhouse = { version = ">=0.15.2, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots"] }
clickhouse-dfe = { version = ">=0.1, <0.2", features = ["tls", "dynamic", "unified", "ext"] }
time = ">=0.3, <0.4"

# Async test utilities
tokio-test = ">=0.4, <0.5"
tempfile = ">=3.10, <4"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "insert_bakeoff"
harness = false

[profile.release]
lto = "thin"           # Link-time optimization (use "fat" for max perf, slower compile)
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # Smaller binary, no unwinding overhead
strip = true           # Remove debug symbols
opt-level = 3          # Maximum optimization (default for release, explicit for clarity)

# =============================================================================
# Advanced Optimization Options (Manual)
# =============================================================================
#
# 1. Profile-Guided Optimization (PGO) - 10-20% improvement:
#    cargo install cargo-pgo
#    cargo pgo build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader  # Run with real workload
#    cargo pgo optimize
#
# 2. BOLT Post-Link Optimization (additional 5-15% on top of PGO):
#    cargo pgo bolt build
#    ./target/x86_64-unknown-linux-gnu/release/dfe-loader-bolt-instrumented  # Run workload
#    cargo pgo bolt optimize
#
# 3. Combined PGO + BOLT:
#    cargo pgo optimize
#    cargo pgo bolt optimize --with-pgo
#
# 4. Fat LTO (slower compile, sometimes faster runtime):
#    Change lto = "thin" to lto = "fat"
#
# References:
# - https://github.com/Kobzol/cargo-pgo
# - https://nnethercote.github.io/perf-book/build-configuration.html

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
# Tests require unsafe for env::set_var/remove_var (edition 2024).
# Production code has zero unsafe blocks — the lib target is clean.
unsafe_code = "allow"
# `#[cfg(tarpaulin)]` is set by cargo-tarpaulin at coverage time. Declaring
# it here silences `unexpected_cfgs` without a build.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
# Some clippy allows below are 1.95+-only (e.g. `duration_suboptimal_units`).
# 1.94 toolchains would otherwise fail with `unknown lint`.
unknown_lints = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# unwrap/expect: allow globally because unit tests (#[cfg(test)] in lib) use them
# extensively and CI runs -D warnings. New prod code should use ? instead.
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Dynamic Map<String, Value> patterns need flexible casting
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
# Pre-existing patterns that are not bugs
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
doc_link_with_quotes = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
match_same_arms = "allow"
redundant_else = "allow"
default_trait_access = "allow"
assigning_clones = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_futures = "allow"
format_push_string = "allow"
float_cmp = "allow"
# Tests use `let mut cfg = X::default(); cfg.field = ...` for readability over
# struct-init. Production code is unaffected.
field_reassign_with_default = "allow"
# Test data sometimes uses literal 3.14 etc. for clarity over `std::f64::consts::PI`.
approx_constant = "allow"
# A handful of test/utility helpers exceed the default 7-arg threshold.
too_many_arguments = "allow"
# Mostly affects internal types in benches/tests where TupleX is fine.
type_complexity = "allow"
# `&Option<T>` appears in a few config setters where call-site ergonomics
# (`set_x(&self.x)`) outweigh the API guideline.
ref_option = "allow"
# Tests use `Duration::from_millis(30000)` etc. for symmetry with config
# values stored in millis. Style-only.
duration_suboptimal_units = "allow"
# `.map(|x| ...).unwrap_or(false)` is clearer than `.is_ok_and()` for some
# readers. Stylistic.
map_unwrap_or = "allow"

[features]
default = []
# Allocator (DFE policy 2026-04-17: jemalloc at every channel, no mimalloc)
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Transport backends
transport-memory = ["scalo/transport-memory"]  # Memory transport for unit tests
# Testing
testcontainers = []  # Enable testcontainers for CI/CD (Docker required)
# PGO workload driver (hyperi-ci Tier 2 — see scripts/pgo-workload.sh)
# Pulls in rdkafka for the producer binary; main loader binary is unaffected.
pgo-driver = ["dep:rdkafka"]
