[package]
name = "dfe-loader"
version = "1.18.2"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Loads Kafka and gRPC streams into ClickHouse in large batched inserts."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-loader"
rust-version = "1.95"
exclude = ["ci/", "docs/", "reference/", "scripts/"]

[lib]
name = "dfe_loader"
path = "src/lib.rs"

[[bin]]
name = "dfe-loader"
path = "src/main.rs"

# PGO/BOLT workload driver, kept out of default builds by `required-features`.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime
tokio = { version = ">=1.54.1, <2", features = ["full"] }
tokio-util = { version = ">=0.7.20, <0.8", features = ["rt"] }

# The floor moves with `release.helm.library` in .hyperi-ci.yaml.
scalo = { version = ">=2.14.29, <3", features = ["config-schema", "transport-kafka", "transport-grpc", "dlq-kafka", "config", "config-reload", "deployment", "version-check", "scaling", "cli-service", "top", "logger", "metrics", "service-metrics", "expression", "memory", "worker-batch", "governor", "secrets", "sink-stack", "geoip-download"] }

# Steps scalo's jittered retry schedule (sink_stack backoff). Range MUST track
# scalo's: BackoffBuilder only applies to the ExponentialBuilder scalo returns.
backon = { version = ">=1.6.0, <2", default-features = false, features = ["std"] }

# Config-schema derivation. Same range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order", "indexmap2"] }

# Range MUST track scalo's: cel::Program crosses the scalo boundary, and two
# semver-incompatible cels make it two types. In ignoreDeps, so it moves with scalo.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }

# JSON parsing (SIMD-accelerated)
sonic-rs = ">=0.5.10, <0.6"
serde = { version = ">=1.0.229, <2", features = ["derive"] }
serde_json = ">=1.0.154, <2"  # Fallback for complex cases
csv = ">=1.4.0, <2"  # CSV remap file parsing (ecs-mapper format compatible)

# Configuration
figment = { version = ">=0.10.19, <0.11", features = ["env"] }
clap = { version = ">=4.6.7, <5", features = ["derive", "env"] }

# Error handling
thiserror = ">=2.0.21, <3"

# Logging & metrics
tracing = ">=0.1.44, <0.2"
metrics = ">=0.24.6, <0.25"

# `stats` gives the memory guard's heap source its stats.allocated.
tikv-jemalloc-ctl = { version = ">=0.7.0, <0.8", optional = true, features = ["stats"] }
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }

# GeoIP enrichment (mmap for long-running apps). scalo's geoip-download provisions the files.
maxminddb = { version = ">=0.32.0, <0.33", features = ["mmap"] }

# The official ClickHouse HTTP client. rustls-tls + rustls-tls-native-roots:
# HTTPS for clients built with Client::default().
clickhouse = { version = ">=0.15.3, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "inserter"] }
# `ext` reads the server's exception code out of an HTTP rejection; `tls`
# (implies `tcp`) is the native-protocol client, rustls only.
dfe-clickhouse = { version = ">=0.1.11, <0.2", default-features = false, features = ["ext", "tls", "dynamic"] }
time = ">=0.3.55, <0.4"

# The HTTP client handed to clickhouse::Client::with_http_client: connect timeout,
# idle-pool eviction and HTTPS verified against the system trust store.
hyper-util = { version = ">=0.1.21, <0.2", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = ">=0.27.10, <0.28", default-features = false, features = ["http1", "tls12", "native-tokio", "aws-lc-rs"] }
rustls = { version = ">=0.23.46, <0.24", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

# Utilities
uuid = { version = ">=1.29.0, <2", features = ["v4", "v7"] }
rustc-hash = ">=2.1.3, <3"  # FxHashMap - faster hashing for internal maps
memchr = ">=2.8.3, <3"     # SIMD byte scanning for directive parser
# Kafka auto-discovery filters are regexes in scalo; escape() keeps a DLQ topic
# name literal. Same crate scalo resolves, so cargo unifies to one regex.
regex = ">=1.13.1, <2"
compact_str = ">=0.10.0, <0.11"  # Stack-allocated strings for short keys (≤23 bytes)
chrono = { version = ">=0.4.45, <0.5", features = ["serde"] }
bytes = ">=1.12.1, <2"
futures = ">=0.3.34, <0.4"
parking_lot = ">=0.13.0, <0.14"
crossbeam-channel = ">=0.5.17, <0.6"
indexmap = { version = ">=2.14.2, <3", features = ["serde"] }

# The PGO workload driver's producer, behind the `pgo-driver` feature.
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"], optional = true }

[dev-dependencies]
# Testing
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
proptest = ">=1.12.0, <2"
test-case = ">=3.4.1, <4"

# Blocking HTTP for sync test reachability probes (ClickHouseTestConfig::is_reachable).
# Held on 0.12: 0.13 drops the rustls-tls-native-roots feature.
reqwest = { version = ">=0.12, <0.13", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

# The Kafka tests' broker image pin and TLS/SASL broker fixture.
scalo = { version = ">=2.14.29, <3", features = ["transport-kafka-test-support"] }

# The status code a raw Push is refused with, through scalo's generated gRPC
# client. Same range as the copy scalo resolves, so cargo unifies to one.
tonic = { version = ">=0.14.9, <0.15", default-features = false }

# Kafka producer for e2e tests (test message injection)
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"] }

# ClickHouse crate -- integration tests need all features
clickhouse = { version = ">=0.15.3, <0.16", features = ["lz4", "time", "rustls-tls", "rustls-tls-native-roots", "inserter"] }
time = ">=0.3.55, <0.4"

# Private CA and server certificates for the TLS ClickHouse tests
rcgen = ">=0.14.10, <0.15"

# Async test utilities
tokio-test = ">=0.4.6, <0.5"

# Sends the loader's tracing output through the test harness's capture. Same
# range as the copy scalo resolves, so cargo unifies to one.
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["env-filter"] }
tempfile = ">=3.27.0, <4"

# The repo's own .env for live-service tests and benches. The binary's .env is read by scalo's cascade.
dotenvy = ">=0.15.7, <0.16"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "transform"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "enrichment"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "insert_bakeoff"
harness = false

[[bench]]
name = "extractor"
harness = false

[[bench]]
name = "json_depth"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
# Tests require unsafe for env::set_var/remove_var (edition 2024).
unsafe_code = "allow"
# cargo-tarpaulin sets `cfg(tarpaulin)`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
# Some clippy allows below name lints an older toolchain does not know.
unknown_lints = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# Doc comments name ClickHouse types and columns without backticks.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
# Turning a method into an associated function rewrites every caller.
unused_self = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
doc_link_with_quotes = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Boxing a future changes the hot path, which needs a measurement first.
large_futures = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
unused_async = "allow"
# The next three are tests only.
manual_let_else = "allow"
default_trait_access = "allow"
format_push_string = "allow"
# Dynamic Map<String, Value> patterns need flexible casting
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
# Tests set fields after `X::default()` for readability.
field_reassign_with_default = "allow"
# Test data sometimes uses literal 3.14 etc. for clarity over `std::f64::consts::PI`.
approx_constant = "allow"
# A handful of test/utility helpers exceed the default 7-arg threshold.
too_many_arguments = "allow"
# Mostly affects internal types in benches/tests where TupleX is fine.
type_complexity = "allow"
# Config setters take `&Option<T>` so call sites read `set_x(&self.x)`.
ref_option = "allow"
# Tests write durations in millis, as config stores them.
duration_suboptimal_units = "allow"
map_unwrap_or = "allow"

[features]
default = []
# Allocator
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Transport backends
transport-memory = ["scalo/transport-memory"]  # Memory transport for unit tests
# Testing
testcontainers = []  # The tests that run real ClickHouse and Kafka containers (Docker required)
# PGO workload driver (scripts/pgo-workload.sh). Only that binary links rdkafka.
pgo-driver = ["dep:rdkafka"]
