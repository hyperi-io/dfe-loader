name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - ".gemini/**"
      - "hyperi-ai"
      - "hyperi-ai/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to publish (e.g. v1.15.2)"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@6d2e0aba4cb28b862fca89c91e763a613c85dd14 # v2.2.0
    with:
      # `both` → release-channel publish on tagged dispatch (unlocks Tier 2 PGO+BOLT).
      # On non-tag pushes the build channel is `spike` regardless (HYPERCI_CHANNEL='').
      publish-target: both
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
