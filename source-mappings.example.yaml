# Example source_to_table mapping file
#
# This file maps _source values to ClickHouse destination table names.
# Can be used instead of (or in addition to) the inline source_to_table
# in the main config file.
#
# Mappings in this file TAKE PRECEDENCE over config file mappings.
#
# Supported formats: YAML (.yaml, .yml), JSON (.json), CSV (.csv)
# Specify path via:
#   - Config file: routing.mapping_file
#   - ENV: LOADER_ROUTING_MAPPING_FILE
#   - CLI: --routing-mapping-file

# Format 1: Direct map (simple)
auth: auth_events
api: api_events
admin: admin_events
errors: error_events
network: network_events

# Format 2: Structured (use either format, not both)
# mappings:
#   - source: auth
#     table: auth_events
#   - source: api
#     table: api_events
