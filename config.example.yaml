# Example configuration for dfe-loader (Rust)
# Copy to config.yaml and modify as needed
#
# Configuration cascade (highest to lowest priority):
#   1. CLI args (--config, --host, etc.)
#   2. Environment variables (DFE_LOADER_KAFKA_BROKERS, etc.)
#   3. .env file
#   4. settings.{env}.yaml
#   5. settings.yaml
#   6. defaults.yaml
#   7. Hard-coded defaults

kafka:
  brokers:
    - localhost:9092
  # The `dfe-` prefix is what a managed broker grants group access on.
  group: dfe-loader
  # Explicit topic list.
  # Leave empty (default) to auto-discover all *_load / *_land topics from the broker,
  # with load-over-land fallback: if {source}_load exists, {source}_land is suppressed.
  # The loader's own DLQ topic (routing.dlq.topic) is never discovered, even if
  # it is named like a landing topic (e.g. dlq_land).
  topics: []
  # topics:
  #   - events_land    # Explicit list — disables auto-discovery
  # Alternatively, replace the *_load / *_land match with a regex (auto-discovery only):
  # topic_regex: "events-.*"
  client_id: dfe-loader

  # Raw librdkafka overrides (highest priority, override all other settings).
  # NOTE: this map REPLACES the built-in defaults wholesale (serde does not
  # merge maps), so anything the loader relies on must be repeated here.
  # statistics.interval.ms drives the per-pod Kafka assigned-partition lag that
  # feeds the horizontal scaling engine's inbound term — keep it > 0 (the
  # built-in default is "5000"). Set to "0" only if you deliberately want NO
  # Kafka-lag-driven scale-out (the engine then falls back to CPU + the
  # ClickHouse sink circuit gate).
  librdkafka_overrides:
    statistics.interval.ms: "5000"

  # SASL authentication (optional). A username or password implies enabled:true.
  # oauthbearer, aws_msk_iam and any unrecognised mechanism are startup errors.
  # sasl:
  #   enabled: true
  #   mechanism: SCRAM-SHA-512  # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
  #   username: user
  #   password: pass
  # TLS configuration (optional). Every key below IS honoured here.
  # tls:
  #   enabled: true
  #   ca_cert_file: /certs/ca.pem
  #   cert_file: /certs/client.pem     # For mTLS
  #   key_file: /certs/client-key.pem  # For mTLS
  #   skip_verify: false

clickhouse:
  hosts:
    - localhost:8123
  database: dfe
  # username may be a literal value, env:VAR, or vault:path:key
  username: default
  # password may be a literal value, env:VAR, or vault:path:key
  # (vault: requires the `secrets` feature, which the loader does not enable today)
  password: ""
  # Protocol: "http" (default and only accepted value) with the HTTP port.
  # "native" is rejected at startup: the pinned clickhouse client has no TCP
  # row fetch, so schema queries stall silently.
  protocol: http
  tables:
    - auth_events
    - api_events
    - admin_events
    - error_events
  # TLS (required for ClickHouse Cloud). `enabled` is the ONLY honoured key --
  # it selects https against the system trust store. ca_cert_file / cert_file /
  # key_file / skip_verify are startup errors: mount a private CA instead.
  # tls:
  #   enabled: true

# Example using env vars (uncomment to use):
# clickhouse:
#   username: env:CLICKHOUSE_USERNAME
#   password: env:CLICKHOUSE_PASSWORD

# =============================================================================
# ClickHouse Cloud Configuration
# =============================================================================
# clickhouse:
#   hosts:
#     - your-instance.region.clickhouse.cloud:8443
#   database: default
#   username: default
#   password: env:CLICKHOUSE_CLOUD_PASSWORD
#   protocol: http
#   tls:
#     enabled: true
#   tables:
#     - auth_events

# Message routing configuration
# Routes messages to destination db.table based on event data fields
routing:
  # Fields to check for database name (first match wins)
  # Supports dot notation for nested fields (e.g., "metadata.org_id")
  db_fields:
    - org_id
    # - tenant_id      # Alternative field
    # - metadata.org   # Nested field example

  # Fields to check for table name (first match wins)
  # Supports dot notation for nested fields
  # Default: ["_source"] — aligned with _source field extraction
  table_fields:
    - _source

  # Default database when db_field value is not found in org_routes (or db_fields is empty)
  default_db: dfe

  # Default table if no table_field matches
  default_table: main

  # Per-organisation database routing.
  # Only orgs explicitly listed here get their own database — all others go to default_db.
  # org_id is matched against the value extracted from org_id_field / db_fields.
  org_routes: []
  # org_routes:
  #   - org_id: acme               # Routes to "acme" database (org_id used as db name)
  #   - org_id: bigcorp            # Routes to "bigcorp" database
  #   - org_id: contoso
  #     database: contoso_dfe      # Custom database name (overrides org_id)

  # Optional: map extracted _source values to destination table names
  source_to_table:
    auth: auth_events
    api: api_events
    admin: admin_events
    errors: error_events

  # External mapping file (CSV, YAML, or JSON)
  # mapping_file: /etc/loader/source-mappings.yaml

  # Topic suffixes stripped when deriving _source from Kafka topic name
  # Example: topic "auth_land" with suffix "_land" → _source = "auth"
  topic_suffixes:
    - _land
    - _load

  # Pre-DFE 2.2 compatibility: prepend event_category/tags.event_category
  # to source_fields and table_fields for backwards compatibility
  compat_v2_source: false

  # Dead Letter Queue settings
  dlq:
    enabled: true
    topic_suffix: ".dlq"

buffer:
  flush_bytes: 1048576    # 1MB
  flush_rows: 10000
  flush_age_secs: 5

# Memory management settings
# The loader tracks buffer memory and applies backpressure before OOM
memory:
  # Maximum memory for buffers in bytes
  # Set to 0 for auto-detection (67% of available)
  limit_bytes: 0
  # Pressure threshold (0.0-1.0) - pause consumption above this
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"

# =============================================================================
# Horizontal scaling-pressure engine (scalo; ENGAGED since the run_app cascade fix)
# =============================================================================
# The engine computes a correlated composite pressure from this pod's LOCAL
# context (CPU + Kafka assigned-partition lag + ClickHouse sink circuit state)
# and emits it as `dfe_loader_scaling_pressure{name="default"}` plus the gratis
# `dfe_loader_transport_inbound_pressure_ratio` / `_outbound_` and
# `dfe_loader_scaling_circuit_open`. KEDA's Prometheus scaler reads these.
#
# This `scaling:` section is SHARED with the legacy weighted ScalingPressure
# (loader_scaling_pressure 0-100). Both deserialise from the same key and ignore
# each other's fields. The legacy weighted knobs (weight_*, saturation_*,
# memory_gate_threshold) keep their defaults unless overridden here.
#
# WIRING STATUS (read before tuning):
#   - scalo's run_app populates the global config cascade from this --config
#     file BEFORE the ServiceRuntime build, so the engine now actually reads
#     `transport.inbound: kafka` below and builds with inbound=Kafka. Earlier
#     builds silently defaulted to inbound=Other / CPU-only.
#   - The ClickHouse sink circuit-open GATE is LIVE: the orchestrator pushes
#     sink health to scaling_signals.set_circuit_open(...), so a dead sink
#     zeroes the emitted pressure (more pods can't relieve a dead sink).
#   - The Kafka assigned-lag term is LIVE (orchestrator pushes
#     set_kafka_assigned_lag(...) from the recv loop, sourced from librdkafka
#     statistics which the loader now enables by default). The inbound term
#     uses it as a RATIO against `params.lag_target`; with lag_target unset the
#     term degrades to the context-aware smart default (CPU + circuit gate)
#     rather than mis-scaling — set lag_target (see below) to scale on backlog.
scaling:
  enabled: true
  interval_secs: 15            # engine evaluation period (off the data hot-path)
  transport:
    inbound: kafka             # picks the Kafka assigned-lag inbound pressure term
    outbound: other            # ClickHouse is NOT a scalo transport -> no outbound term
  params:
    cpu_target: 0.70           # CPU utilisation that counts as "full" for scale-out
    # lag_target: <PER-POD>    # INTENTIONALLY OMITTED — needs sizing. PER-POD =
    #   sustained_msgs_per_sec_per_pod * tolerable_backlog_seconds. Until sized,
    #   the Kafka lag term contributes 0 (smart default = CPU + circuit gate)
    #   rather than mis-scaling on an arbitrary number.
  pressures: []                # empty => the context-aware smart default:
                               #   circuit_open ? 0 : 100 * min(1, max(
                               #     cpu_ratio / cpu_target, inbound_pressure_ratio))

logging:
  level: info    # trace, debug, info, warn, error
  format: json   # json, text

# Timestamp Data Quality settings
timestamp_dq:
  enabled: true
  max_future_seconds: 600
  max_past_seconds: 0
  invalid_action: replace_with_now
  correct_known_bad: true

# Field name sanitization
field_sanitization:
  strip_at_prefix: true
  handle_numeric_prefix: true
  numeric_prefix: "col_"
  collapse_underscores: true
  trim_underscores: true
  collision_strategy: last_wins

# Metadata field injection (Common Header v2.1)
# Requires ClickHouse 26.2+ (JSON type GA + text index GA)
metadata:
  # Master switch for common header injection (default: true)
  # When false, no common header fields (_timestamp, _org_id, _raw, _json, _tags, _source) are injected
  enabled: true

  # Capture mode controls how _json and _raw are populated.
  # All modes extract promoted fields to schema columns; the only difference
  # is where (or whether) the full payload is preserved.
  #
  #   full           -- _json = full payload (JSON type), _raw = extracted from raw_source_fields
  #                    Default. Full observability: JSON path queries + text search.
  #
  #   raw_only       -- _json = NULL, _raw = entire Kafka payload as String
  #                    CH CPU saving: skips JSON type overhead, text search via _raw index.
  #                    Note: _raw contains the FULL payload, not extracted from a field.
  #
  #   json_only      -- _json = full payload (JSON type), _raw = NULL
  #                    JSON path queries without the duplicate text copy of the payload.
  #
  #   extracted_only -- _json = NULL, _raw = NULL
  #                    Minimal: only promoted schema fields. No payload preservation.
  capture_mode: full

  # Per-table capture mode overrides (highest priority: DDL @capture_mode comment).
  # table_capture_modes:
  #   "dfe.metrics": extracted_only       # high-volume metrics, no payload needed
  #   "dfe.raw_logs": raw_only            # raw log dump, text search only
  #   "dfe.events": full                  # default — explicit for clarity

  inject_timestamp_load: true
  extract_timestamp_collector: true
  collector_timestamp_path: "tags.collector.timestamp"

  # _source field (destination table identifier)
  # Derived from: 1) message data field, 2) Kafka topic (strip suffix), 3) default
  capture_source: true
  source_fields:
    - _source
  source_output: "_source"

  # _raw source fields (only used in `full` capture_mode).
  # First-match field rename to _raw. In raw_only mode, the entire Kafka payload
  # is used instead and these fields are ignored.
  raw_source_fields:
    - logoriginal
  raw_output: "_raw"

# Type coercion settings
coercion:
  unknown_type_fallback: String
  array_to_json: true

# Field mapping (rename/copy source fields to destination schema names)
# Maps incoming field names to standardised schemas (ECS, CIM, etc.)
# Only active for fields that exist in the destination ClickHouse table.
field_mapping:
  enabled: false                # Disabled by default (zero overhead)
  default_action: rename        # "rename" (remove source) or "copy" (keep source)
  builtin: none                 # Built-in preset: "ecs", "cim", "beats", or "none"
  files: []                     # External remap files (CSV/YAML/JSON paths)
  # files:
  #   - /etc/loader/custom-mapping.csv    # ecs-mapper CSV format
  #   - /etc/loader/extra-mapping.yaml    # YAML format
  # Per-destination action overrides (override default_action for specific fields)
  # overrides:
  #   related.ip:
  #     action: copy            # Always copy pivot fields, don't rename
  #   related.user:
  #     action: copy

# Schema caching
schema:
  cache_ttl_secs: 300            # TTL before background refresh marks schema stale
  refresh_on_error: true          # refresh cache on insert errors
  pre_warm_retry_secs: 60        # retry budget for initial schema fetch at startup
  pending_max_per_table: 1000     # buffered messages per table while awaiting schema
  pending_max_total: 10000        # total buffered across all tables (FIFO evict on overflow)
  pending_max_age_secs: 30        # DLQ pending messages older than this

# Hot-reload: watch config file for changes at runtime
# Safe to reload: buffer, routing, metadata, field_sanitization, timestamp_dq, coercion
# Requires restart: kafka, clickhouse, payload format
hot_reload:
  enabled: false          # Enable config file watching
  poll_interval_secs: 5   # How often to check for file changes
  debounce_ms: 500        # Minimum time between reloads
