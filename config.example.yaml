# Example configuration for dfe-loader (Rust)
# Copy to config.yaml and modify as needed
#
# Configuration cascade (highest to lowest priority):
#   1. CLI args (--config, --host, etc.)
#   2. Environment variables (DFE_LOADER_KAFKA_BROKERS, etc.)
#   3. .env file
#   4. settings.{env}.yaml
#   5. settings.yaml
#   6. defaults.yaml
#   7. Hard-coded defaults

kafka:
  brokers:
    - localhost:9092
  group: clickhouse-loader
  # Explicit topic list.
  # Leave empty (default) to auto-discover all *_load / *_land topics from the broker,
  # with load-over-land fallback: if {source}_load exists, {source}_land is suppressed.
  topics: []
  # topics:
  #   - events_land    # Explicit list — disables auto-discovery
  # Alternatively, use regex for topic matching:
  # topic_regex: "events-.*"
  client_id: clickhouse-loader

  # Raw librdkafka overrides (highest priority, override all other settings).
  # Stats disabled by default to prevent log spam.
  librdkafka_overrides:
    statistics.interval.ms: "0"

  # SASL authentication (optional)
  # sasl:
  #   enabled: true
  #   mechanism: PLAIN  # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
  #   username: user
  #   password: pass
  # TLS configuration (optional)
  # tls:
  #   enabled: true
  #   ca_cert_file: /certs/ca.pem
  #   cert_file: /certs/client.pem     # For mTLS
  #   key_file: /certs/client-key.pem  # For mTLS
  #   skip_verify: false

clickhouse:
  hosts:
    - localhost:9000
  database: default
  username: default
  password: ""
  # Protocol: "native" (default) - HTTP not supported in Rust version
  # Native protocol is required for performance
  protocol: native
  tables:
    - auth_events
    - api_events
    - admin_events
    - error_events
  # TLS configuration (optional for self-hosted, required for ClickHouse Cloud)
  # tls:
  #   enabled: true
  #   ca_cert_file: /certs/ca.pem        # Optional: custom CA cert
  #   skip_verify: false

# =============================================================================
# ClickHouse Cloud Configuration
# =============================================================================
# clickhouse:
#   hosts:
#     - your-instance.region.clickhouse.cloud:9440
#   database: default
#   username: default
#   password: "your-cloud-password"
#   protocol: native
#   tls:
#     enabled: true
#   tables:
#     - auth_events

# Message routing configuration
# Routes messages to destination db.table based on event data fields
routing:
  # Fields to check for database name (first match wins)
  # Supports dot notation for nested fields (e.g., "metadata.org_id")
  db_fields:
    - org_id
    # - tenant_id      # Alternative field
    # - metadata.org   # Nested field example

  # Fields to check for table name (first match wins)
  # Supports dot notation for nested fields
  # Default: ["_source"] — aligned with _source field extraction
  table_fields:
    - _source

  # Default database when db_field value is not found in org_routes (or db_fields is empty)
  default_db: dfe

  # Default table if no table_field matches
  default_table: dfe

  # Per-organisation database routing.
  # Only orgs explicitly listed here get their own database — all others go to default_db.
  # org_id is matched against the value extracted from org_id_field / db_fields.
  org_routes: []
  # org_routes:
  #   - org_id: acme               # Routes to "acme" database (org_id used as db name)
  #   - org_id: bigcorp            # Routes to "bigcorp" database
  #   - org_id: contoso
  #     database: contoso_dfe      # Custom database name (overrides org_id)

  # Optional: map extracted _source values to destination table names
  source_to_table:
    auth: auth_events
    api: api_events
    admin: admin_events
    errors: error_events

  # External mapping file (CSV, YAML, or JSON)
  # mapping_file: /etc/loader/source-mappings.yaml

  # Topic suffixes stripped when deriving _source from Kafka topic name
  # Example: topic "auth_land" with suffix "_land" → _source = "auth"
  topic_suffixes:
    - _land
    - _load

  # Pre-DFE 2.2 compatibility: prepend event_category/tags.event_category
  # to source_fields and table_fields for backwards compatibility
  compat_v2_source: false

  # Dead Letter Queue settings
  dlq:
    enabled: true
    topic_suffix: ".dlq"

buffer:
  flush_bytes: 1048576    # 1MB
  flush_rows: 10000
  flush_age_secs: 5

# Memory management settings
# The loader tracks buffer memory and applies backpressure before OOM
memory:
  # Maximum memory for buffers in bytes
  # Set to 0 for auto-detection (67% of available)
  limit_bytes: 0
  # Pressure threshold (0.0-1.0) - pause consumption above this
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"

logging:
  level: info    # trace, debug, info, warn, error
  format: json   # json, text

# Timestamp Data Quality settings
timestamp_dq:
  enabled: true
  max_future_seconds: 600
  max_past_seconds: 0
  invalid_action: replace_with_now
  correct_known_bad: true

# Field name sanitization
field_sanitization:
  strip_at_prefix: true
  handle_numeric_prefix: true
  numeric_prefix: "col_"
  collapse_underscores: true
  trim_underscores: true
  collision_strategy: last_wins

# Metadata field injection (Common Header v2)
metadata:
  # Master switch for common header injection (default: true)
  # When false, no common header fields (_timestamp, _org_id, _raw, _json, _tags, _source) are injected
  enabled: true

  inject_timestamp_load: true
  extract_timestamp_collector: true
  collector_timestamp_path: "tags.collector.timestamp"

  # _source field (destination table identifier)
  # Derived from: 1) message data field, 2) Kafka topic (strip suffix), 3) default
  capture_source: true
  source_fields:
    - _source
  source_output: "_source"

# Type coercion settings
coercion:
  unknown_type_fallback: String
  array_to_json: true

# Field mapping (rename/copy source fields to destination schema names)
# Maps incoming field names to standardised schemas (ECS, CIM, etc.)
# Only active for fields that exist in the destination ClickHouse table.
field_mapping:
  enabled: false                # Disabled by default (zero overhead)
  default_action: rename        # "rename" (remove source) or "copy" (keep source)
  builtin: none                 # Built-in preset: "ecs", "cim", "beats", or "none"
  files: []                     # External remap files (CSV/YAML/JSON paths)
  # files:
  #   - /etc/loader/custom-mapping.csv    # ecs-mapper CSV format
  #   - /etc/loader/extra-mapping.yaml    # YAML format
  # Per-destination action overrides (override default_action for specific fields)
  # overrides:
  #   related.ip:
  #     action: copy            # Always copy pivot fields, don't rename
  #   related.user:
  #     action: copy

# Schema caching
schema:
  cache_ttl_secs: 300   # 5 minutes
  refresh_on_error: true

# Hot-reload: watch config file for changes at runtime
# Safe to reload: buffer, routing, metadata, field_sanitization, timestamp_dq, coercion
# Requires restart: kafka, clickhouse, payload format
hot_reload:
  enabled: false          # Enable config file watching
  poll_interval_secs: 5   # How often to check for file changes
  debounce_ms: 500        # Minimum time between reloads
