# dfe-loader Helm chart values
#
# Generated by scalo deployment module.
# Contract points validated by cargo test.

# -- Number of replicas, ignored while a KEDA ScaledObject or the HPA
# fallback renders, because that then owns the replica count.
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-loader
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- OTLP export target. Only consulted by an app built with scalo's
# otel features; ignored otherwise. Empty leaves the app's own default
# in place rather than switching anything off. Example:
# http://opentelemetry-collector.observability:4317
# Spans can carry request attributes, so keep this in-cluster. To leave
# the cluster use https:// and set the OTel SDK's certificate env vars.
otel:
  endpoint: ""
  protocol: grpc

# -- Pod-level security context. Matches the uid the generated image
# switches to; change both together or the container will not start.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. readOnlyRootFilesystem stays
# false because the spool and DLQ write to disk and the only volume
# mounted here is the read-only config map; set it true only for an
# app that spools nowhere.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe/loader.yaml)
config:
  transport: ''
  kafka:
    brokers:
    - localhost:9092
    group: dfe-loader
    topics: []
    topic_regex: null
    client_id: dfe-loader
    sasl: null
    tls: null
    allow_insecure_transport: false
    librdkafka_overrides:
      statistics.interval.ms: '5000'
  grpc:
    listen: null
    recv_buffer_size: 10000
    recv_timeout_ms: 100
    max_message_size: 16777216
    compression: false
    default_topic: main_land
  clickhouse:
    hosts:
    - localhost:8123
    database: dfe
    username: default
    password: ''
    protocol: http
    insert_format: rowbinary
    tables: []
    tls: null
  payload:
    format: auto
    mismatch_threshold: 10
    pipeline_mode: json_primary
  metrics:
    enabled: true
    address: 0.0.0.0:9090
  logging:
    level: info
    format: json
  schema:
    cache_ttl_secs: 300
    refresh_on_error: true
    pre_warm_retry_secs: 60
    pending_max_per_table: 1000
    pending_max_total: 10000
    pending_max_age_secs: 30
  geoip:
    enabled: false
    provider: db_ip_lite
    city_db_path: null
    asn_db_path: null
    auto_download:
      enabled: true
      data_dir: /var/lib/dfe/geoip
      maxmind_account_id: null
      maxmind_license_key: null
      ipinfo_token: null
      max_age_days: 30
    cache_capacity: 100000
  computed_columns:
    columns: {}
    overrides: {}
  column_directives:
    global: {}
    tables: {}
  hot_reload:
    enabled: false
    poll_interval_secs: 5
    debounce_ms: 500
  keda:
    enabled: true
    min_replicas: 1
    max_replicas: 10
    polling_interval: 15
    cooldown_period: 300
    kafka_lag_threshold: 1000
    activation_lag_threshold: 0
    cpu_enabled: true
    cpu_threshold: 80
  scaling:
    enabled: true
    memory_gate_threshold: 0.8
    weight_kafka_lag: 0.35
    weight_buffer_depth: 0.25
    weight_insert_latency: 0.15
    weight_memory: 0.15
    weight_errors: 0.1
    saturation_kafka_lag: 100000.0
    saturation_buffer_depth: 10000.0
    saturation_insert_latency: 5.0
    saturation_errors: 100.0
  batch_processing:
    max_chunk_size: 10000
    format: auto
    routing_field: null
    pre_route_filters: []
    parse_error_action: dlq
    known_fields:
    - _table
    - _timestamp
    - _source
    - host
    - source_type
    - event_type
  routing:
    rules: []
    db_fields: []
    table_fields:
    - _source
    default_db: dfe
    default_table: main
    org_id_field: org_id
    org_routes: []
    source_to_table: {}
    mapping_file: null
    topic_suffixes:
    - _land
    - _load
    compat_v2_source: false
    dlq:
      enabled: true
      mode: cascade
      topic: dfe_loader_dlq
      topic_suffix: .dlq
      file_enabled: true
      file_path: /var/spool/dfe/dlq
      kafka_enabled: true
  buffer:
    flush_bytes: 1048576
    flush_rows: 20000
    flush_age_secs: 5
  memory:
    limit_bytes: 0
    pressure_threshold: 0.8
  timestamp_dq:
    enabled: true
    max_future_seconds: 600
    max_past_seconds: 0
    invalid_action: replace_with_now
    correct_known_bad: true
  field_sanitization:
    strip_at_prefix: true
    handle_numeric_prefix: true
    numeric_prefix: col_
    collapse_underscores: true
    trim_underscores: true
    collision_strategy: last_wins
  metadata:
    enabled: true
    inject_timestamp_load: true
    extract_timestamp_collector: true
    collector_timestamp_path: tags.collector.timestamp
    tags_fields:
    - tags
    - _tags
    - meta
    - metadata.tags
    tags_output: _tags
    drop_tags: false
    capture_mode: full
    table_capture_modes: {}
    capture_json: true
    json_output: _json
    capture_raw: true
    raw_source_fields:
    - logoriginal
    raw_output: _raw
    capture_source: true
    source_fields:
    - _source
    source_output: _source
    disable_json_tables: []
    disable_raw_tables: []
    remove_routing_fields: true
  coercion:
    type_mappings: {}
    unknown_type_fallback: String
    null_handling: default
    null_strings:
    - 'null'
    - 'NULL'
    - 'Null'
    - None
    - nil
    - undefined
    - \N
    - <null>
    - NA
    - N/A
    - n/a
    - NaN
    default_timezone: UTC
    timezone_fields:
    - tags_collector_timezone
    array_to_json: true
    strict: false
  field_mapping:
    enabled: false
    default_action: rename
    builtin: none
    files: []
    overrides: {}
  enrichment:
    ip_fields:
    - src_ip
    - client_ip
    - ip
    - source_ip
    reputation:
      enabled: false
      cache_capacity: 100000
      blocklist_files: []
    risk_scoring:
      enabled: false
      preset: global

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- clickhouse credentials
clickhouse:
  existingSecret: ""
  secretKeys:
    password: clickhouse-password
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
