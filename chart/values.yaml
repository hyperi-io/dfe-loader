# dfe-loader Helm chart values
#
# Contract points (must match app defaults — validated by cargo test):
#   Port:       9090 (src/config/loader.rs MetricsConfig::default)
#   Liveness:   /healthz (src/metrics/server.rs)
#   Readiness:  /readyz  (src/metrics/server.rs)
#   Metrics:    /metrics (src/metrics/server.rs)
#   Env prefix: DFE_LOADER (src/config/loader.rs)

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-loader
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Loader configuration (mounted as /etc/dfe/loader.yaml)
# Sensitive fields (passwords) are injected via env vars from Secret,
# NOT included in the ConfigMap.
config:
  kafka:
    brokers: "kafka:9092"
    group_id: "dfe-loader"
    topics:
      - "dfe.default"
    security_protocol: "SASL_PLAINTEXT"
    sasl_mechanism: "SCRAM-SHA-512"
  clickhouse:
    url: "http://clickhouse:8123"
    database: "dfe"
    username: "default"
  routing:
    default_db: "dfe"
    default_table: "default"
  metrics:
    enabled: true
    address: "0.0.0.0:9090"

# -- Kafka credentials
# Set existingSecret to use a pre-existing K8s Secret.
# Otherwise, username/password below are used to create one.
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- ClickHouse credentials
clickhouse:
  existingSecret: ""
  secretKeys:
    password: clickhouse-password
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config.kafka.topics)
    topic: ""
    # -- Override consumer group (default: config.kafka.group_id)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
