# Cargo build configuration for dfe-loader
#
# Target platforms: Linux x86_64 and aarch64 only
# SIMD optimizations enabled for sonic-rs and arrow

# =============================================================================
# Per-target CPU optimizations
# =============================================================================
# x86_64: AVX2 + SSE4.2 (available on all modern Intel/AMD since ~2013)
# aarch64: NEON (baseline for all ARM64)

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]  # AVX2, BMI1/2, FMA (Haswell+)

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]    # NEON is baseline for ARM64

# For local development, use native CPU features
[build]
rustflags = ["-C", "target-cpu=native"]

# Limit parallel jobs to reduce CPU/memory usage (prevents killing other processes)
jobs = 2

# =============================================================================
# HyperSec Private Cargo Registry (Artifactory)
# =============================================================================
#
# The 'hypersec' registry hosts internal crates like hs-rustlib.
# Authentication is handled via ~/.cargo/credentials.toml
#
# To set up credentials:
#   1. Get token: jf config export hypersec-token | base64 -d | jq -r '.accessToken'
#   2. Add to ~/.cargo/credentials.toml:
#      [registries.hypersec]
#      token = "Bearer <your-token>"
#
# Or use cargo-login (if available):
#   cargo login --registry hypersec

[registries.hypersec]
index = "sparse+https://hypersec.jfrog.io/artifactory/api/cargo/hypersec-cargo-virtual/index/"
credential-provider = "cargo:token"

# Uncomment to make hypersec the default for publishing
# [registry]
# default = "hypersec"
