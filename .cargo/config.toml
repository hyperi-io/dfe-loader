# Cargo build configuration for dfe-loader
#
# Target platforms: Linux x86_64 and aarch64 only
# SIMD optimizations enabled for sonic-rs

# =============================================================================
# Per-target CPU optimizations
# =============================================================================
# x86_64: AVX2 + SSE4.2 (available on all modern Intel/AMD since ~2013)
# aarch64: NEON (baseline for all ARM64)

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]  # AVX2, BMI1/2, FMA (Haswell+)

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic"]    # NEON is baseline for ARM64

# Native CPU features, only on a host with no matching [target] table above
# (e.g. macOS): cargo applies a matching [target] table even without --target.
[build]
rustflags = ["-C", "target-cpu=native"]
