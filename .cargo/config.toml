# Project:   dfe-loader
# File:      .cargo/config.toml
# Purpose:   Cargo build configuration with per-target CPU optimisations
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]  # AVX2, BMI1/2, FMA (Haswell+)

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic"]    # NEON is baseline for ARM64

# For local development, use native CPU features
[build]
rustflags = ["-C", "target-cpu=native"]

# Limit parallel jobs to reduce CPU/memory usage (prevents killing other processes)
jobs = 2
