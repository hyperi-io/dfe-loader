# hyperi-ci's default markdownlint rules, which a repo config replaces rather than extends.
config:
  default: true
  # Markdown has no width limit: a paragraph is one line and the editor soft-wraps it.
  MD013: false
  MD060: false
  MD033: false
  MD024:
    siblings_only: true
  MD041: false

# Licence terms are legal text and are never edited to satisfy a linter.
ignores:
  - AI-TRAINING-POLICY.md
  - COMMERCIAL.md
