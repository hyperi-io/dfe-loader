# Development configuration for dfe-loader
# Uses minimal memory footprint to avoid impacting dev environment
#
# Usage: ./loader --config config.dev.yaml
# Or: cp config.dev.yaml config.yaml

kafka:
  brokers:
    - localhost:19092
  group: dfe-loader-dev
  topics:
    - events
  client_id: dfe-loader-dev

clickhouse:
  hosts:
    - localhost:8123
  database: default
  username: default
  password: ""
  # http on the 8123-family port, or native on 9000 (9440 with TLS).
  protocol: http
  tables:
    - auth_events
    - api_events

routing:
  table_fields:
    - event_category
    - tags.event_category
  default_db: common
  default_table: common
  source_to_table:
    auth: auth_events
    api: api_events
  dlq:
    enabled: true
    topic_suffix: ".dlq"

buffer:
  flush_bytes: 67108864  # 64 MiB, a ceiling for oversized rows: rows trigger first
  flush_rows: 1000
  flush_age_secs: 2

memory:
  limit_bytes: 67108864
  pressure_threshold: 0.8

batch_processing:
  routing_field: "_table"        # SIMD pre-route: extract _table before full parse
  max_chunk_size: 10000
  parse_error_action: dlq        # dlq | skip | fail_batch
  known_fields:
    - "_table"
    - "_timestamp"
    - "host"
    - "source_type"

metrics:
  enabled: true
  address: "0.0.0.0:9090"

logging:
  level: debug
  format: text

timestamp_dq:
  enabled: true
  max_future_seconds: 600
  invalid_action: replace_with_now
  correct_known_bad: true

schema:
  cache_ttl_secs: 60
  refresh_on_error: true
