# cargo-deny v0.19+ configuration
# Run: cargo deny check

[advisories]
# paste (dtolnay) marked unmaintained but has no replacement and is
# deeply embedded in the Rust ecosystem. Ignore until a successor exists.
# astral-tokio-tar: low-severity (1.7) transitive dev-dep via testcontainers.
# No upstream fix available. Dismissed per Dependabot alert #3.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0066"]

[licenses]
allow = [
    "FSL-1.1-ALv2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/hyperi-io/clickhouse-rs.git"]
