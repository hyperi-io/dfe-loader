# cargo-deny configuration
# Run: cargo deny check

[graph]
# The release build adds `--features jemalloc` on every channel, so the default
# graph omits tikv-jemalloc-ctl and every advisory reachable through it.
features = ["jemalloc"]

[advisories]
# A transitive crate still ships in the binary, so the scope covers the whole
# graph, not just this crate's direct dependencies.
unmaintained = "all"
yanked = "warn"
maximum-db-staleness = "P90D"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time proc-macro reached only through tikv-jemalloc-ctl, so it has no runtime exposure; drop when that chain moves to pastey, which cel already uses" },
    { id = "GHSA-qwgh-2vcv-g2f7", reason = "Reached only through the lock: digest 0.10 <- sha2 <- termwiz <- ratatui-termwiz <- ratatui <- scalo, and ratatui's termwiz feature is never enabled, so no build compiles it. Drop when the lock stops carrying digest 0.10, which the digest 0.11 move does." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
