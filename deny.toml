# cargo-deny v0.19+ configuration
# Run: cargo deny check

[advisories]
# paste (dtolnay) marked unmaintained but has no replacement and is
# deeply embedded in the Rust ecosystem. Ignore until a successor exists.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "FSL-1.1-ALv2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
