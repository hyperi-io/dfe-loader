# cargo-deny v0.19+ configuration
# Run: cargo deny check

[advisories]
# RUSTSEC-2024-0436: `paste` (proc-macro) is unmaintained. Pulled transitively by
# tikv-jemalloc-ctl -> jemalloc; no fix until that chain drops it. Compile-time
# only (proc-macro), so no runtime exposure. Ignore until jemalloc-ctl moves off.
# (RUSTSEC-2026-0066/astral-tokio-tar patched in d76e82c; memmap2/anyhow/quinn-proto
# advisories cleared by lockfile bumps, not ignores.)
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/hyperi-io/clickhouse-rs.git"]
